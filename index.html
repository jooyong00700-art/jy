<!DOCTYPE html>
<html lang="ko">
<head>
<script>
/* 커스텀 도메인 접속 시 랜딩페이지(wing-modoo)로 이동 / github.io 접속은 기존 대시보드 유지 */
(function(){try{var h=(location.hostname||'').toLowerCase();if((h==='wing-ss.com'||h==='www.wing-ss.com')&&(location.pathname==='/'||location.pathname==='/index.html')){location.replace('wing-modoo.html'+location.search+location.hash);}}catch(e){}})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b34">
<title>리스페토 통합 대시보드 · BIGCELL 스타일</title>
<style>
:root{
  --navy:#0f1a30; --navy2:#18294a; --navy3:#24365c;
  --ink:#16202f; --ink2:#43506a; --muted:#7b869a;
  --line:#e6eaf1; --line2:#eef1f6;
  --bg:#f3f5fa; --card:#ffffff;
  --blue:#2f6bff; --blue-weak:#eef3ff;
  --up:#e03e3e; --down:#1c7ed6;
  --green:#0ea47a; --amber:#f08c00;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,27,48,.05), 0 8px 24px -14px rgba(16,27,48,.18);
  --tap:44px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
button{font-family:inherit; font-size:inherit; cursor:pointer; border:0; background:none; color:inherit}
input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
.num{font-variant-numeric:tabular-nums; letter-spacing:-.2px}

/* ---------- layout ---------- */
.shell{display:flex; min-height:100vh; align-items:flex-start}
.side{
  width:232px; flex:0 0 232px; background:var(--navy); color:#c8d2e4;
  position:sticky; top:0; height:100vh; overflow-y:auto; padding-bottom:20px;
  scrollbar-width:thin;
}
.side::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb{background:#2b3c60; border-radius:3px}
.brand{display:flex; align-items:center; gap:8px; padding:16px 18px 12px; color:#fff; font-weight:800; letter-spacing:.5px; font-size:17px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.25)}
.brand small{font-weight:600;font-size:10px;color:#7d8db0;letter-spacing:0}
.nav-group{padding:6px 0 2px}
.nav-title{padding:10px 18px 6px; font-size:11px; letter-spacing:.12em; color:#61719a; font-weight:700; text-transform:uppercase}
.nav-item{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:9px 18px; font-size:13.5px; color:#c3cee2; border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.05); color:#fff}
.nav-item.on{background:rgba(47,107,255,.16); color:#fff; border-left-color:#3b82f6; font-weight:700}
.nav-item .ico{width:16px; text-align:center; opacity:.85; font-size:13px}
.nav-item .badge{margin-left:auto; font-size:10px; background:#2f6bff; color:#fff; border-radius:99px; padding:1px 6px; font-weight:700}
.main{flex:1 1 auto; min-width:0; padding:18px 22px 90px; max-width:1560px}

/* topbar */
.topbar{display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.topbar h1{font-size:21px; margin:0; letter-spacing:-.4px}
.topbar .sub{color:var(--muted); font-size:12.5px}
.spacer{flex:1}
.chip{display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:6px 11px; font-size:12px; color:var(--ink2); box-shadow:var(--shadow)}
.chip b{color:var(--ink)}
.chip .live{width:7px;height:7px;border-radius:50%;background:#22b573; box-shadow:0 0 0 3px rgba(34,181,115,.18)}

/* ---------- cards ---------- */
.grid{display:grid; gap:14px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.card-h{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line2); flex-wrap:wrap}
.card-h h2{font-size:15px; margin:0; letter-spacing:-.3px}
.card-h .note{font-size:11.5px; color:var(--muted); font-weight:500}
.card-b{padding:14px 16px}
.card-b.flush{padding:0}

/* KPI */
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.kpi{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 15px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.kpi .lab{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px}
.kpi .val{font-size:22px; font-weight:800; letter-spacing:-.6px; margin-top:6px}
.kpi .val small{font-size:13px; font-weight:700; color:var(--muted); margin-left:2px}
.kpi .delta{font-size:12px; font-weight:700; margin-top:4px; display:flex; gap:5px; align-items:center}
.kpi.accent{background:linear-gradient(135deg,#1b2d52,#0f1a30); border-color:#1b2d52; color:#fff}
.kpi.accent .lab{color:#93a4c6}
.kpi.accent .val{color:#fff}
.kpi.accent .delta{color:#8fd3ff}
.up{color:var(--up)}
.down{color:var(--down)}
.flat{color:var(--muted)}
.tag{font-size:10.5px; font-weight:800; padding:2px 6px; border-radius:6px; background:#eef1f7; color:#5b6784}
.tag.estimate{background:#fff4e0; color:#a86000}
.tag.live{background:#e8f8f1; color:#0a7f5c}
.tag.coup{background:#eef3ff; color:#2f6bff}

/* 오늘 매출 카드 · 쿠폰 전/후 */
.coup-line{display:flex; flex-wrap:wrap; align-items:center; gap:3px 9px; margin-top:6px; font-size:12px; font-weight:600; color:#93a4c6}
.coup-line b{color:#fff; font-weight:800}
.coup-line .c2{color:#ffc9c9}

/* ---------- ⚡ 실시간 순수익 조회 ---------- */
.live-kpi{display:flex; flex-direction:column}
.live-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.live-h .lab{flex:1 1 auto; min-width:0}
.live-btn{
  margin-left:auto; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:38px; padding:8px 13px; border-radius:10px; white-space:nowrap;
  font-size:12.5px; font-weight:800; letter-spacing:-.2px; color:#fff;
  background:linear-gradient(135deg,#5aa0ff 0%,#2f6bff 55%,#1f4fd8 100%);
  border:1px solid rgba(180,214,255,.55);
  box-shadow:0 8px 20px -8px rgba(59,130,246,1), inset 0 1px 0 rgba(255,255,255,.3);
  transition:filter .15s, transform .06s;
}
.live-btn:hover{filter:brightness(1.07)}
.live-btn:active{transform:translateY(1px)}
.live-btn .bolt{font-size:13px; filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
.lp-src{display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:#f7f9fd; border:1px solid var(--line); border-radius:11px; padding:8px 11px; font-size:12px; color:#5b6784}
.lp-src b{color:var(--ink)}
.lp-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px}
.lp-grid .form-row{margin-bottom:0}
.lp-grid .form-row label{display:block; font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lp-grid .inp{width:100%; font-size:14px; font-weight:800; padding:9px 10px; text-align:right}
.lp-mix{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.lp-mix .form-row{margin-bottom:0}
.lp-mix .inp, #lpRateCtl .inp{width:100%; font-size:14px; font-weight:800; padding:9px 10px; text-align:right}
/* 쿠폰 차감액 · 쿠폰 제외 실매출 */
.lp-coup{display:grid; grid-template-columns:172px minmax(0,1fr); gap:9px; margin-top:9px; align-items:stretch}
.lp-coup .form-row{margin-bottom:0}
.lp-coup .clab{display:flex; align-items:center; gap:5px; font-size:11.5px; color:#4a5674; font-weight:700; white-space:nowrap; margin-bottom:4px}
.lp-coup .clab .mini{font-size:10.5px; font-weight:800; color:var(--blue); background:#eef3ff; border-radius:6px; padding:1px 7px}
.lp-coup .clab .mini.off{color:#8b96ab; background:#eef1f7}
.lp-coup .inp{width:100%; min-height:38px; font-size:14px; font-weight:800; padding:9px 10px; text-align:right}
.lp-csum{border:1px solid #d7e3ff; border-radius:11px; padding:8px 11px; background:linear-gradient(135deg,#f7faff,#eef3ff); min-width:0}
.lp-csum .l{font-size:11px; color:#526a99; font-weight:700}
.lp-csum .n{font-size:17px; font-weight:800; letter-spacing:-.5px; color:#1d3f8f; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lp-csum .d{font-size:10.5px; color:#7b869a; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lp-resgrid{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.lp-res{border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:#fff; min-width:0}
.lp-res .l{font-size:11.5px; color:var(--muted); font-weight:700}
.lp-res .n{font-size:20px; font-weight:800; letter-spacing:-.6px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lp-res .d{font-size:11px; color:var(--muted); margin-top:3px; line-height:1.4}
.lp-res.lp-sales{grid-column:1/-1; background:linear-gradient(135deg,#f7faff,#eef3ff); border-color:#d7e3ff}
.lp-res.lp-sales .l{color:#526a99}
.lp-res.lp-sales .n{font-size:26px; color:#1d3f8f}
.lp-net{grid-column:1/-1; background:linear-gradient(135deg,#1b2d52,#0f1a30); border-color:#1b2d52; color:#fff}
.lp-net .l{color:#93a4c6}
.lp-net .n{font-size:32px; color:#fff}
.lp-net .n.neg{color:#ff9b9b}
.lp-net .d{color:#93a4c6}
.lp-rate{grid-column:1/-1; display:flex; align-items:baseline; gap:10px}
.lp-rate .n{margin:0 0 0 auto}
.lp-hint{font-size:11.5px; color:var(--muted); margin-top:7px; line-height:1.6}
.lp-hint b{color:#4a5674}
.lp-hint .ok{color:#0a7f5c; font-weight:800}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto; -webkit-overflow-scrolling:touch}
table.tbl{width:100%; border-collapse:collapse; font-size:13px}
table.tbl th, table.tbl td{padding:10px 12px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line2)}
table.tbl th{background:#fafbfd; color:#66718a; font-weight:700; font-size:12px; position:sticky; top:0; z-index:1}
table.tbl th:first-child, table.tbl td:first-child{text-align:left}
table.tbl td.l, table.tbl th.l{text-align:left}
table.tbl tbody tr:hover{background:#fafbff}
table.tbl tr.total td{background:#f6f9ff; font-weight:800; border-top:2px solid #dbe4f7}
table.tbl tr.total td:first-child{color:var(--ink)}
.tbl .prod{display:flex; align-items:center; gap:9px; text-align:left}
.thumb{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#e9eefb,#dfe7f8); display:grid; place-items:center; font-size:15px; flex:0 0 34px}
.prod .nm{font-weight:700; font-size:13px; letter-spacing:-.2px}
.prod .cd{font-size:11px; color:var(--muted)}
.pill{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; background:#eef2fb; color:#3d5680}
.pill.rfm{background:#eaf1ff; color:#2158c9}
.pill.p3p{background:#f1eeff; color:#5b46c9}
.pill.warn{background:#fff1f1; color:#c92a2a}
.pill.ok{background:#e9f9f2; color:#0a7f5c}

/* ---------- 정산 27컬러 · 재고 · 상품관리 ---------- */
.thumb.sm{width:26px;height:26px;border-radius:7px;flex:0 0 26px;font-size:12px;margin-right:6px}
.settle-tbl th, .settle-tbl td{padding:9px 10px}
.settle-tbl th{font-size:11.5px; line-height:1.25}
.settle-tbl .th2{font-size:9.5px; font-weight:600; color:#9aa5ba; letter-spacing:0}
.settle-tbl .sticky-c{position:sticky; left:0; z-index:2; background:#fff; box-shadow:1px 0 0 var(--line2); min-width:196px; max-width:240px}
.settle-tbl thead .sticky-c{background:#fafbfd; z-index:3}
.settle-tbl tr.total .sticky-c{background:#f6f9ff}
.settle-tbl tbody tr:hover .sticky-c{background:#fafbff}
.settle-tbl .sticky-c .nm{font-weight:800; font-size:12.5px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px}
.settle-tbl .sticky-c .cd{font-size:10px; color:var(--muted); white-space:nowrap}
.settle-tbl td.sticky-c{display:flex; align-items:center; gap:2px}
.sbtn{width:20px; flex:0 0 20px; color:var(--blue); font-size:11px; font-weight:800; padding:0}
.pname-wrap{min-width:0}
.hd{background:#fff1f1; color:#c92a2a; font-size:9.5px; font-weight:800; padding:1px 4px; border-radius:4px}
.srow.ishid .nm{color:#8b96ab}
sdet>td{background:#f8faff!important; padding:10px 12px!important; border-bottom:1px solid var(--line)}
.sdet-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(142px,1fr)); gap:6px 14px}
.sd-i{display:flex; align-items:baseline; justify-content:space-between; gap:8px; border-bottom:1px dashed #e3e9f6; padding:3px 0; font-size:11.5px}
.sd-l{color:#66718a}
.sd-l em{font-style:normal; font-size:9.5px; color:#9aa5ba}
.sd-v{font-weight:700}
.costgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px}
.ctile{background:#f8fafd; border:1px solid var(--line); border-radius:10px; padding:8px 10px}
.ctile .t{font-size:11px; color:var(--muted); font-weight:700}
.ctile .v{font-size:14px; font-weight:800; margin-top:2px; letter-spacing:-.3px}
.ctile.hl{background:#eef3ff; border-color:#d9e4ff}
.ctile.hl .v{color:var(--blue)}
.stk-need{background:#fff8ec}
.stk-zero{color:var(--muted)}
.prodact{white-space:nowrap}
.prodact button{font-size:11.5px; font-weight:800; border:1px solid #dfe5f0; border-radius:8px; padding:4px 9px; background:#fff; color:#43506a}
.prodact button.hide{color:#c92a2a; border-color:#ffd6d6}
.prodact button.show{color:#0a7f5c; border-color:#bfe9d8}

/* ---------- controls ---------- */
.toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.seg{display:inline-flex; background:#eef1f7; border-radius:9px; padding:3px; gap:2px}
.seg button{padding:5px 11px; border-radius:7px; font-size:12px; font-weight:700; color:#5f6b85}
.seg button.on{background:#fff; color:var(--blue); box-shadow:0 1px 3px rgba(16,27,48,.12)}
.switch{display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--ink2); font-weight:600; cursor:pointer; user-select:none}
.switch input{appearance:none; width:34px; height:19px; border-radius:99px; background:#d6dcea; position:relative; transition:.15s; flex:0 0 34px; cursor:pointer}
.switch input:checked{background:var(--blue)}
.switch input::after{content:""; position:absolute; width:15px;height:15px;border-radius:50%;background:#fff; top:2px; left:2px; transition:.15s}
.switch input:checked::after{left:17px}
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 12px; font-size:12.5px; font-weight:700; color:var(--ink2); box-shadow:0 1px 1px rgba(16,27,48,.03)}
.btn:hover{border-color:#c9d4e8; color:var(--ink)}
.btn.primary{background:var(--blue); border-color:var(--blue); color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--blue); padding:6px 8px}
select.inp, input.inp{background:#fff; border:1px solid var(--line); border-radius:9px; padding:7px 10px; font-size:12.5px; color:var(--ink); min-height:34px}
select.inp:focus, input.inp:focus{outline:2px solid #c7d8ff; outline-offset:0; border-color:#9dbcff}
input.inp[type=number]{text-align:right}

/* ---------- charts ---------- */
.chart{width:100%; height:auto; display:block}
.chart.sm{height:auto}
.legend{display:flex; gap:14px; justify-content:center; font-size:11.5px; color:#59647c; flex-wrap:wrap; margin-bottom:2px}
.legend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:-1px}
.tip{position:fixed; pointer-events:none; background:#101b34; color:#fff; font-size:11.5px; padding:7px 9px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.25); z-index:80; opacity:0; transition:opacity .08s; white-space:nowrap}
.tip.on{opacity:1}

/* ---------- calendar ---------- */
.cal-wrap{display:grid; grid-template-columns:230px minmax(0,1fr); gap:14px; padding:14px 16px}
.cal-side{display:flex; flex-direction:column; gap:12px}
.yearbar{display:flex; align-items:center; justify-content:space-between; background:#f7f9fd; border:1px solid var(--line); border-radius:11px; padding:6px 8px}
.yearbar b{font-size:15px}
.yearbar button{width:28px;height:28px;border-radius:8px;color:#5f6b85}
.yearbar button:hover{background:#e9eefb}
.months{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.months button{padding:9px 0; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:12.5px; font-weight:700; color:#55617a}
.months button.on{background:var(--blue); border-color:var(--blue); color:#fff}
.memo-item{background:#fff9e8; border:1px solid #ffe6a8; border-radius:9px; padding:8px 9px; font-size:12px; margin-bottom:6px}
.memo-item b{display:block; margin-bottom:2px}
.memo-add{width:100%; border:1px dashed #cfd8e8; border-radius:9px; padding:8px; font-size:12px; color:#5f6b85; background:#fff}
.memo-add:hover{border-color:#9dbcff; color:var(--blue)}
.side-chart-lab{font-size:11.5px; color:var(--muted); margin-bottom:4px}
.cal-toggles{display:flex; flex-direction:column; gap:7px; background:#f7f9fd; border:1px solid var(--line); border-radius:11px; padding:10px 11px}
.grid-cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-left:1px solid var(--line); border-top:1px solid var(--line); border-radius:11px; overflow:hidden; background:#fff}
.grid-cal .dow{padding:7px 0; text-align:center; font-size:11.5px; font-weight:800; color:#6b7690; background:#f7f9fd; border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.grid-cal .dow.sun{color:#d64545}
.grid-cal .dow.sat{color:#2f6bff}
.day{min-height:92px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:5px 6px; position:relative; background:#fff; text-align:left; display:flex; flex-direction:column; gap:1px}
.day.other{background:#fbfcfe; color:#b3bccd}
.day.today{box-shadow:inset 0 0 0 2px var(--blue); z-index:2}
.day.sel{background:#f5f9ff}
.day .dn{font-size:11px; font-weight:800; color:#41506b}
.day.sun .dn{color:#d64545}
.day.sat .dn{color:#2f6bff}
.day .sales{font-size:13px; font-weight:800; letter-spacing:-.4px; color:#16202f; line-height:1.2}
.day .s-short{display:none}
.day .settle .s-short{display:none}
.day .delta{font-size:10px; font-weight:700}
.day .line{font-size:10.5px; color:#5b6784; display:flex; gap:4px; align-items:center; justify-content:space-between}
.day .line b{font-weight:700; color:#41506b}
.day .line .v{font-weight:700}
.day .line .v.net{color:#2f6bff}
.day .empty{font-size:10.5px; color:#b9c2d3; margin-top:6px}
.day .qty-line{font-size:9.5px; font-weight:700; color:#41506b; display:flex; gap:3px; align-items:center; flex-wrap:wrap; line-height:1.35}
.day .qty-line .qn{font-size:10px; font-weight:800; color:#16202f}
.day .qty-line .qa{color:#a36200; background:#fff4e0; border-radius:4px; padding:0 3px; font-weight:700}
.day .qty-line .qo{color:#0d7a5a; background:#e6f7f1; border-radius:4px; padding:0 3px; font-weight:700}
.day .qty-line .qp{color:#98a3b8; font-weight:600}
.day .qty-line .aob{padding:0 4px; font-size:8.5px; line-height:1.5}
.day .qty-line .aob b{font-size:9.5px}
.qsplit{font-size:10.5px; color:#5b6784; display:flex; gap:3px; align-items:center; margin-top:2px}

.ao-cell{display:flex; flex-direction:column; gap:1px; align-items:flex-start}

  const ov = (S && S.hidden) ? S.hidden[id] : null;
  if(ov!=null) return !!ov;
  const p = PRODUCTS.find(x=>x.id===id);
  return !!(p && p.hidden);
}
function visibleProducts(){ return PRODUCTS.filter(p=>!isHidden(p.id)); }
function hiddenProducts(){ return PRODUCTS.filter(p=>isHidden(p.id)); }

function stockNeedInbound(r){
  if(!r) return false;
  if(r.stock===0 && r.daily>0) return true;
  if(r.stock===0 && r.soldout) return true;
  if(!r.soldout) return false;
  const d = dateObj(r.soldout);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today)/86400000) <= 30;
}

function wingStockByPid(){
  const out = {};
  if(typeof BC7==='undefined' || !BC7.wing || !BC7.wing.stock) return out;
  (BC7.rfm||[]).forEach(p=> (p.options||[]).forEach(o=>{
    const v = BC7.wing.stock[o.optId];
    if(v==null || o.state==='반품') return;
    out[p.pid] = (out[p.pid]||0) + Number(v);
  }));
  return out;
}

/* ---------- 쿠폰(할인) 기준 ---------- */
/* 쿠팡 윙 > 로켓그로스 > 재고현황의 매출은 쿠폰·할인 적용 전 판매가 기준이다.
   판매 수량 × 상품 비중으로 쿠폰 차감액을 산출해 '쿠폰 제외 실매출'을 함께 관리한다. */
const COUPON_MIX = [
  {id:'8188501167', coupon:3000},   // 빨래건조대 22,990원 / 쿠폰 3,000원
  {id:'9701805278', coupon:800}     // 신발깔창 10,790원 / 쿠폰 800원
];
const COUPON_DEFAULT_MIX = {mix1:90, mix2:10};
function couponNum(v){ return (v==null || v==='' || isNaN(Number(v))) ? null : Math.max(0, Math.round(Number(v))); }
/* 판매 수량과 상품 비중 → 예상 쿠폰 차감액 */
function estCoupon(qty, mix1, mix2){
  const q = Math.max(0, Math.round(Number(qty)||0));
  const w1 = Math.max(0, Number(mix1==null?COUPON_DEFAULT_MIX.mix1:mix1)||0);
  const w2 = Math.max(0, Number(mix2==null?COUPON_DEFAULT_MIX.mix2:mix2)||0);
  const tw = w1 + w2;
  const q1 = tw ? Math.round(q*w1/tw) : 0;
  const q2 = Math.max(0, q - q1);
  return q1*COUPON_MIX[0].coupon + q2*COUPON_MIX[1].coupon;
}
/* {sales, coupon, netSales} 를 서로 모순 없게 정리 (쿠폰 우선, 실매출 = 매출 − 쿠폰) */
function liveNumbers(live, mix1, mix2){
  const o = Object.assign({}, live||{});
  const sales = Math.max(0, Number(o.sales)||0);
  const qty = Math.max(0, Number(o.qty)||0);
  const c = couponNum(o.coupon), n = couponNum(o.netSales);
  let coupon;
  if(c!=null) coupon = Math.min(c, sales);
  else if(n!=null) coupon = Math.max(0, Math.min(sales, sales-n));
  else coupon = Math.min(sales, estCoupon(qty, mix1, mix2));
  return Object.assign({}, o, {sales, qty, coupon, netSales:Math.max(0, sales-coupon)});
}
/* 자동 수집 응답(live) 반영: netSales·coupon 이 있으면 그대로, 없으면 수량·상품 비중으로 산출 */
function applyLive(src, prev, mix1, mix2){
  const s = src || {};
  const merged = Object.assign({}, prev||{});
  ['date','sales','qty','adExVat','at','profit','options','campaigns'].forEach(k=>{ if(s[k]!=null && s[k]!=='') merged[k] = s[k]; });
  if(s.profit==null || s.profit==='') delete merged.profit;   // 전날 추정치가 오늘로 넘어오지 않게
  else delete merged.profitEstimate;                          // 수집된 실제 마진은 추정치가 아니다
  delete merged.coupon; delete merged.netSales;
  const c = couponNum(s.coupon), n = couponNum(s.netSales);
  if(c!=null) merged.coupon = c;
  else if(n!=null) merged.coupon = Math.max(0, (Number(merged.sales)||0) - n);
  if(n!=null) merged.netSales = n;
  return liveNumbers(merged, mix1, mix2);
}

function loadLive(saved){
  const base = Object.assign({}, DEFAULTS.live);
  if(!saved || typeof saved!=='object') return liveNumbers(base);
  const merged = Object.assign({}, base, saved);
  if(couponNum(saved.coupon)==null && couponNum(saved.netSales)==null){ delete merged.coupon; delete merged.netSales; }
  return liveNumbers(merged);
}

const won = n => (n==null || isNaN(n)) ? '-' : Math.round(n).toLocaleString('ko-KR');

function fmtDate(s){ const d = dateObj(s); return `${d.getMonth()+1}/${pad(d.getDate())}(${DOW[d.getDay()]})`; }

}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* 마진 계산 (빅셀 산식 검증 완료) */
function margin(p){
  const ov = S.costOverrides[p.id];
  const price = ov && ov.price!=null ? ov.price : p.price;
  const disc = ov && ov.disc!=null ? ov.disc : p.disc;
  const fee = ov && ov.fee!=null ? ov.fee : p.fee;
  const cost = ov && ov.cost!=null ? ov.cost : p.cost;
  const inout = ov && ov.inout!=null ? ov.inout : (p.inout||0);
  const ship = ov && ov.ship!=null ? ov.ship : (p.ship||0);
  const base = price - disc;
  const feeAmt = Math.round(base * fee/100);   /* 빅셀은 수수료를 원단위 반올림해 차감 → 이익금 1원까지 일치 */
  const profit = base - feeAmt - cost - inout - ship;
  const rate = price ? profit/price*100 : 0;
  return {price, disc, fee, cost, inout, ship, base, feeAmt, profit, rate};
}
function profitOf(p){ return margin(p).profit; }

/* 실적 시리즈 (override 반영)
   - 하드코딩 DAILY + 자동 수집(bigcell-live.json)의 daily 값을 날짜(d) 기준으로 병합
   - DAILY 에 없는 새 날짜(예: 오늘 실시간 행)도 빠짐없이 포함해 보고서·캘린더·이번 달 합계에 반영 */
function dailySeries(){
  /* 빅셀 캘린더에서 받은 과거 일자별(2026-05~11): [매출, 광고비, 순이익금] */
  const histRows = Object.keys(HIST).map(d=>({d, sales:HIST[d][0], ad:HIST[d][1], net:HIST[d][2],
      profit:(HIST[d][2]!=null && HIST[d][1]!=null) ? HIST[d][2]+HIST[d][1] : null, hist:true}))
    .filter(h=>!DAILY.some(r=>r.d===h.d));
  const extra = Object.keys(S.dailyOverrides||{})
    .filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d) && !DAILY.some(r=>r.d===d) && !HIST[d]);
  const base = DAILY.concat(histRows, extra.map(d=>({d, live:true})));
  base.sort((a,b)=> a.d<b.d ? -1 : (a.d>b.d ? 1 : 0));
  const liveDate = (S.live && S.live.date) || null;
  return base.map(r => {
    const o = S.dailyOverrides[r.d] || {};
    const sales = o.sales!=null? Number(o.sales) : r.sales;
    const ad = o.ad!=null? Number(o.ad) : r.ad;
    const qty = o.qty!=null? Number(o.qty) : r.qty;
    const coupon = o.coupon!=null? Number(o.coupon) : r.coupon;
    /* 광고 판매수(광고센터 전환 판매수) · 자연 판매수(=전체−광고). 집계 전이면 null */
    const adQty = o.adQty!=null? Number(o.adQty) : (r.adQty!=null? Number(r.adQty) : null);
    const organicQty = o.organicQty!=null? Number(o.organicQty)
      : (r.organicQty!=null? Number(r.organicQty)
        : (adQty!=null && qty!=null ? Math.max(0, qty-adQty) : null));
    const netSales = o.netSales!=null? Number(o.netSales)
      : (sales!=null ? sales - (coupon||0) : r.netSales);
    let profit = o.profit!=null? Number(o.profit) : r.profit;
    let estimate = profit==null;
    if(estimate && sales!=null){
      profit = Math.round(sales*blendedMargin());
    }
    /* 원가·할인가 구간이 수정되어 있으면 이익금을 즉시 재계산 */
    let segCalc = false;
    if(S.segments && Object.keys(S.segments).length && profit!=null){
      const exact = segProfitFor(r.d);
      if(exact!=null){ profit = exact; segCalc = true; estimate = false; }
      else { const sc = segScale(r.d); if(sc && Math.abs(sc-1) > 0.0005){ profit = Math.round(profit*sc); segCalc = true; } }
    }
    return Object.assign({}, r, {sales, ad, qty, coupon, netSales, profit, adQty, organicQty,
      adPending: (adQty==null && qty!=null), segCalc,
      net: (profit!=null && ad!=null) ? profit-ad : null,
      live: r.d === liveDate, estimate});
  });
}
function blendedMargin(){
  // 최근 7일 이익률 (매출 가중)
  const rows = DAILY.filter(r=>r.profit!=null).slice(-7);
  const sales = rows.reduce((a,r)=>a+r.sales,0);
  const profit = rows.reduce((a,r)=>a+r.profit,0);
  return sales ? profit/sales : 0.19;
}
function liveRow(){
  const t = S.live || {};
  const rows = dailySeries();
  const row = rows.find(r=>r.d===t.date) || null;
  const n = v => (v==null || v==='' || isNaN(Number(v))) ? null : Number(v);
  const qty = n(t.qty)!=null ? Math.max(0, n(t.qty)) : (row && row.qty!=null ? row.qty : 0);
  const sales = n(t.sales)!=null ? Math.max(0, n(t.sales)) : (row ? (row.sales||0) : 0);
  const coupon = n(t.coupon)!=null ? Math.max(0, Math.min(sales, n(t.coupon)))
                 : (row && n(row.coupon)!=null ? Math.max(0, n(row.coupon)) : Math.min(sales, estCoupon(qty)));
  const netSales = Math.max(0, sales - coupon);
  const ad = n(t.adExVat)!=null ? Math.round(n(t.adExVat)*(S.vat||1.1))
             : (row && row.ad!=null ? row.ad : 0);
  /* 실제 옵션별 마진 합계(options 합계 또는 live.profit)가 있으면 추정치(blendedMargin)보다 우선 사용 */
  let profit = null, estimate = false;
  if(Array.isArray(t.options) && t.options.length && t.options.some(o=>n(o.margin)!=null)){
    profit = t.options.reduce((s,o)=> s + (n(o.margin)||0), 0);
  } else if(n(t.profit)!=null) profit = n(t.profit);
  else if(row && row.profit!=null && row.sales===sales) profit = row.profit;
  if(profit==null){ profit = Math.round(sales*blendedMargin()); estimate = true; }
  if(t.profitEstimate) estimate = true;
  /* 광고 판매수: 광고센터 당일 전환은 익일 확정 → 집계 전이면 null */
  const adQty = n(t.adQty)!=null ? Math.max(0, n(t.adQty)) : (row && row.adQty!=null ? row.adQty : null);
  const organicQty = adQty!=null && qty!=null ? Math.max(0, qty-adQty) : null;
  return {d:t.date, sales, coupon, netSales, qty, ad, profit, adQty, organicQty,
    adPending: (adQty==null && qty!=null), net:profit-ad, estimate};
}

/* ============================== 차트 ============================== */
const SERIES_COLOR = {sales:'#101b34', profit:'#12b886', ad:'#f59f00', net:'#2f6bff'};

function lineChart(rows, keys, opts){
  opts = opts || {};

  max = Math.ceil(max / step) * step;
  if(max<=0) max = 1;
  const x = i => L + (rows.length<=1 ? iw/2 : iw * i / (rows.length-1));
  const y = v => T + ih - (v/max)*ih;
  let g = '';

    const gy = 4;
    for(let i=0;i<=gy;i++){
      const v = max*i/gy, yy = y(v);
      g += `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#eef1f6"/>`;
      g += `<text x="${L-8}" y="${yy+3.5}" text-anchor="end" font-size="10" fill="#93a0b6">${won(v)}</text>`;
    }
    rows.forEach((r,i) => {
      if(rows.length>16 && i%2) return;
      g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#93a0b6">${r.d.slice(5,10).replace('-','/')}</text>`;
    });
  }
  keys.forEach(k => {
    let d = '', started = false;
    rows.forEach((r,i) => {
      if(r[k]==null){ started = false; return; }
      d += (started?'L':'M') + x(i).toFixed(1) + ' ' + y(r[k]).toFixed(1) + ' ';

    if(!compact) rows.forEach((r,i)=>{ if(r[k]!=null) g += `<circle cx="${x(i).toFixed(1)}" cy="${y(r[k]).toFixed(1)}" r="2.4" fill="#fff" stroke="${SERIES_COLOR[k]||'#888'}" stroke-width="1.6"/>`; });
  });
  rows.forEach((r,i)=>{
    const w = iw/Math.max(1,rows.length-1);
    g += `<rect data-i="${i}" x="${(x(i)-w/2).toFixed(1)}" y="${T}" width="${w.toFixed(1)}" height="${ih}" fill="transparent" style="pointer-events:all" class="hit"/>`;
  });
  const cid = 'ch'+(++CHART_SEQ);
  CHARTS[cid] = rows;
  const par = compact ? 'none' : 'xMidYMid meet';
  const style = compact ? `style="height:${opts.h||120}px"` : '';
  return `<svg class="chart ${opts.cls||''}" ${style} viewBox="0 0 ${W} ${H}" preserveAspectRatio="${par}" data-chart="1" data-cid="${cid}">${g}</svg>`;
}
function legend(keys, labels){
  return `<div class="legend">${keys.map((k,i)=>`<span><i style="background:${SERIES_COLOR[k]}"></i>${labels[i]}</span>`).join('')}</div>`;
}
function barChart(items, opts){
  opts = opts||{};
  const W=900,H=opts.h||190,L=8,R=8,T=14,B=34;
  const iw=W-L-R, ih=H-T-B, n=items.length;
  const max=Math.max.apply(null, items.map(i=>Math.abs(i.v)).concat([1]));

      price:implied, disc:0, fee:o.f, cost:(o.c||master.cost||0), inout:o.io, ship:o.sh,

      price:p.price, disc:p.disc, fee:p.fee, cost:p.cost, inout:p.inout||0, ship:p.ship||0,
      q2025:0, s2025:0, net2025:0, seedFrom:'2026-01-01', weight:0});
  }
  /* 총 가중치 정규화 */
  const tot = out.reduce((a,o)=>a+(o.weight||0),0) || 1;
  out.forEach(o=> o.weight = (o.weight||0)/tot);
  return out;
})();
function costSeed(o){
  return [{from:o.seedFrom, to:'', cost:o.cost, fee:o.fee, inout:o.inout, ship:o.ship,
           price:o.price, disc:o.disc}];
}
function segList(id){
  if(!S.segments) S.segments = {};
  if(!S.segments[id]) S.segments[id] = costSeed(COST_OPTS.find(o=>o.id===id)||{seedFrom:'2026-01-01'});
  return S.segments[id];
}
function segAt(id, ds){
  const list = segList(id).filter(s=> (!s.from || s.from<=ds) && (!s.to || ds<=s.to));
  list.sort((a,b)=> (a.from||'')<(b.from||'') ? 1 : -1);
  return list[0] || null;
}
function econOf(base, seg){
  const price = (seg && seg.price!=null) ? seg.price : (base.price!=null?base.price:22990);
  const disc  = (seg && seg.disc!=null) ? seg.disc : (base.disc||0);
  const fee   = (seg && seg.fee!=null) ? seg.fee : (base.fee||11.88);
  const cost  = (seg && seg.cost!=null) ? seg.cost : (base.cost||0);
  const inout = (seg && seg.inout!=null) ? seg.inout : (base.inout||0);
  const ship  = (seg && seg.ship!=null) ? seg.ship : (base.ship||0);
  const room  = price - disc;
  const feeAmt = room*fee/100;
  const profit = room - feeAmt - cost - inout - ship;
  return {price, disc, fee, cost, inout, ship, room, feeAmt, profit, rate: price? profit/price*100 : 0};
}
function optEcon(id, ds){
  const base = COST_OPTS.find(o=>o.id===id); if(!base) return null;
  return econOf(base, segAt(id, ds));
}
function hasSegEdits(){
  if(!S.segments) return false;
  return Object.keys(S.segments).some(k=>{
    const base = COST_OPTS.find(o=>o.id===k); if(!base) return true;
    const seed = costSeed(base)[0], cur = S.segments[k][0];
    if(!cur || S.segments[k].length!==1) return true;
    return ['cost','fee','inout','ship','price','disc'].some(f=> (seed[f]??null)!==(cur[f]??null));
  });
}
/* 원가 구간 반영 비율: 기본 대비 개당 이익금 변화 (2025 매출 가중) */
let _segCache = {};
function clearSegCache(){ _segCache = {}; }
function segScale(ds){
  if(_segCache[ds]!=null) return _segCache[ds];
  let num=0, den=0;
  COST_OPTS.forEach(o=>{
    const e0 = econOf(o, costSeed(o)[0]);
    const e1 = optEcon(o.id, ds);
    if(!e1) return;
    const w = Math.max(o.weight||0, 0.001);
    num += e1.profit*w; den += e0.profit*w;
  });
  const v = den ? num/den : 1;
  _segCache[ds] = v;
  return v;
}
/* 특정 일자의 상품·옵션별 판매 내역 (빅셀/윙/라이브에서 확보된 것만) */
function byItemFor(ds){
  const t = S.live || {};
  if(ds===t.date && Array.isArray(t.options) && t.options.length)
    return t.options.map(o=>({name:o.name, qty:o.qty, adQty:null, organicQty:null, sales:o.sales, margin:o.margin}));
  if(ds==='2026-11-18' && DEFAULTS.live.options)
    return DEFAULTS.live.options.map(o=>({name:o.name, qty:o.qty, adQty:null, organicQty:null, sales:o.sales, margin:o.margin}));
  return null;
}
/* 화면 표시용 상품(품목)별 판매 내역 — bigcell-live.json daily[].items(상품별 광고/자연 분리 포함)를 우선 사용.
   ※ 이익금 재계산(segProfitFor)은 기존 byItemFor를 그대로 써서 확정 수치가 바뀌지 않게 둔다. */
function itemRowsFor(ds){
  const t = S.live || {};
  if(ds===t.date) return byItemFor(ds);
  const ov = (S.dailyOverrides || {})[ds];
  if(ov && Array.isArray(ov.items) && ov.items.length)
    return ov.items.map(x=>({name:x.name, qty:x.qty,
      adQty:(x.adQty!=null?x.adQty:null), organicQty:(x.organicQty!=null?x.organicQty:null),
      sales:x.sales, margin:x.margin}));
  return byItemFor(ds);
}
function segProfitFor(ds){
  const bi = byItemFor(ds);
  if(!bi || !bi.length) return null;
  let sum = 0, matched = 0;
  bi.forEach(x=>{
    const name = String(x.name||'');
    const o = COST_OPTS.find(c=> name.indexOf(c.name)>=0 || (c.name.indexOf('올화이트')>=0 && name.indexOf('올화이트')>=0));
    if(!o) return;
    const e = optEcon(o.id, ds); if(!e) return;
    sum += e.profit * (x.qty||0); matched += (x.qty||0);
  });
  return matched ? Math.round(sum) : null;
}

/* ---- 오늘 옵션별 판매 & 운영 중 광고 실시간 이익 ---- */
function todayOptionsCard(live){
  const opts = Array.isArray(S.live.options) && S.live.options.length ? S.live.options : DEFAULTS.live.options;

      <tbody>${rows}</tbody>
    </table></div>

}
function todayCampaignsCard(live){
  const camps = Array.isArray(S.live.campaigns) && S.live.campaigns.length ? S.live.campaigns : DEFAULTS.live.campaigns;
  /* 캠페인별 광고비(VAT포함)를 상단 '오늘 광고비'와 같은 총액(live.ad)에 맞춰 1원 단위로 배분한다.
     캠페인별 반올림 합계가 총액과 1원 어긋나 '오늘 순이익'과 '합계'가 달라 보이던 문제를 없앤다. */
  const exSum = camps.reduce((a,c)=>a+(Number(c.spendExVat)||0), 0);
  const vatTotal = (live && live.ad!=null) ? Math.round(live.ad) : Math.round(exSum*(S.vat||1.1));
  const parts = camps.map((c,i)=>{
    const exact = (Number(c.spendExVat)||0)*(S.vat||1.1);
    return {i, v:Math.floor(exact), frac:exact-Math.floor(exact)};
  });
  let rest = vatTotal - parts.reduce((a,p)=>a+p.v, 0);
  parts.slice().sort((a,b)=> (b.frac-a.frac) || (b.v-a.v)).forEach(p=>{ if(rest>0){ p.v++; rest--; } });
  if(rest<0) parts.slice().sort((a,b)=> (a.frac-b.frac) || (b.v-a.v)).forEach(p=>{ if(rest<0 && p.v>0){ p.v--; rest++; } });
  const vatOf = {}; parts.forEach(p=>{ vatOf[p.i] = p.v; });
  const calcs = camps.map((c,i)=>({c, vat:vatOf[i], margin:Number(c.margin)||0, profit:(Number(c.margin)||0)-vatOf[i]}));
  const totalP = calcs.reduce((a,x)=>a+x.profit, 0);
  const rows = calcs.map(({c,vat,margin,profit:p})=>{
    const stCls = String(c.status||'').includes('운영') ? 'up' : 'flat';
    return `<tr>
      <td class="l"><b>${esc(c.name)}</b><div class="sub" style="margin:2px 0 0">${esc(c.note||'')} · <span class="${stCls}">${esc(c.status||'')}</span></div></td>

      <td class="num">${won(margin)}원</td>
      <td class="num"><b class="${p>=0?'up':'down'}">${p>=0?'+':''}${won(p)}원</b></td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <div class="card-h">
      <div><h2>📣 광고 실시간 이익</h2><div class="sub">캠페인별 당일 옵션 마진 − 오늘 광고비(VAT포함)</div></div>
      <span class="pill">합계 ${totalP>=0?'+':''}${won(totalP)}원</span>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th class="l">캠페인</th><th>광고비(VAT포함)</th><th>옵션 마진</th><th>실시간 이익</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="note" style="margin-top:8px">※ 쿠팡 광고센터 당일 전환매출은 익일 확정되어, 당일 해당 옵션 실판매 마진에서 오늘 누적광고비(VAT포함)를 빼서 산출했어요. 캠페인별 광고비는 총 광고비(${won(vatTotal)}원)에 맞춰 1원 단위로 배분해 합계가 위 '오늘 순이익'과 같습니다.</div>
  </div>`;
}

/* ---------- 광고 / 자연 판매수 배지 · 비율 바 공통 (2026-11-22 시인성 개선) ----------
   광고 = 쿠팡 광고센터 전환 판매수(익일 확정), 자연 = 총 판매수 − 광고.
   어느 화면(보고서·캘린더·요약칸·상세 모달)에서든 같은 배지·막대를 쓴다. */
function aoKnown(adQty, organicQty){ return adQty!=null && organicQty!=null; }
function aoPctOf(n, total){ return (n==null || !total) ? 0 : (n/total*100); }
function aoBadges(adQty, organicQty, qty, o){
  o = o || {};
  const size = o.small ? ' sm' : '';
  if(!aoKnown(adQty, organicQty))
    return `<span class="aob pend${size}">${esc(o.pendText || '광고/자연 집계 전')}</span>`;
  const pctOn = (o.pct !== false) && qty;
  const lbl = o.emojiOnly ? '' : '<span class="lbl">광고</span> ';
  const lblO = o.emojiOnly ? '' : '<span class="lbl">자연</span> ';
  return `<span class="aob ad${size}" title="광고 판매 ${adQty}개 (쿠팡 광고센터 전환 판매수)${pctOn?` · 비중 ${pct1(aoPctOf(adQty,qty))}%`:''}">📣 ${lbl}<b>${adQty}</b>${pctOn?`<span class="pct">${pct1(aoPctOf(adQty,qty))}%</span>`:''}</span>`
       + `<span class="aob og${size}" title="자연 판매 ${organicQty}개 (총 ${qty}개 − 광고 ${adQty}개)${pctOn?` · 비중 ${pct1(aoPctOf(organicQty,qty))}%`:''}">🌿 ${lblO}<b>${organicQty}</b>${pctOn?`<span class="pct">${pct1(aoPctOf(organicQty,qty))}%</span>`:''}</span>`;
}
function aoRatio(adQty, organicQty, qty, cls){
  const c = cls ? ' '+cls : '';
  if(!aoKnown(adQty, organicQty) || !qty)
    return `<div class="ao-ratio pend${c}" title="광고 전환 판매수는 익일 확정됩니다"><i></i></div>`;
  const ap = pct1(aoPctOf(adQty,qty)), op = pct1(aoPctOf(organicQty,qty));
  return `<div class="ao-ratio${c}" title="광고 ${adQty}개 ${ap}% · 자연 ${organicQty}개 ${op}%"><i class="ad" style="width:${ap}%"></i><i class="og" style="width:${op}%"></i></div>`;
}
function aoCell(r, o){
  o = o || {};
  if(r.qty==null) return '<span class="flat">-</span>';
  const pend = o.pendText || (r.live ? '광고 집계 전' : '광고 미기록');
  return `<div class="ao-cell"><div class="ao-cell-badges"><span class="q">${r.qty}개</span>${aoBadges(r.adQty,r.organicQty,r.qty,{small:true, pendText:pend})}</div>${aoRatio(r.adQty,r.organicQty,r.qty)}</div>`;
}

/* ---------- 광고/자연 판매 밑 "어떤 품목" 내역 (2026-11-22) ----------
   상품 단위(건조대·깔창) 광고/자연 수량 = bigcell-live.json daily[].items 의 adQty/organicQty(확정치).
   색상(옵션) 단위는 쿠팡 광고센터 캠페인별 전환 판매수가 확정된 날만 괄호로 덧붙인다.
   자연 판매의 색상 분리는 쿠팡이 제공하지 않아(옵션 판매수 − 광고 전환 이 음수가 되는 날이 있음)
   상품 단위로만 표기한다 — 숫자를 임의로 나누지 않는다. */
const AD_OPTION_CONF = {
  '2026-11-20':[{name:'올크림',adQty:22},{name:'올화이트',adQty:9},{name:'깔창',adQty:3},{name:'올블랙',adQty:2}],
  '2026-11-21':[{name:'올크림',adQty:17},{name:'올화이트',adQty:15},{name:'올블랙',adQty:11},{name:'깔창',adQty:3}]
};
const AO_COLOR_ORDER = ['올화이트','올크림','올블랙','깔창'];
function aoColorOf(n){
  const s = String(n||'');
  if(/올화이트/.test(s)) return '올화이트';
  if(/올크림/.test(s)) return '올크림';
  if(/올블랙/.test(s)) return '올블랙';
  /* 과거 캠페인명은 '화이트/크림/블랙'으로만 적혀 있다(예: *26년 10월 31일 (620) 화이트) */
  if(/화이트/.test(s)) return '올화이트';
  if(/크림/.test(s)) return '올크림';
  if(/블랙/.test(s)) return '올블랙';
  if(/깔창/.test(s)) return '깔창';
  return '';
}
function aoProdOf(n){
  const s = String(n||'');
  if(/깔창/.test(s)) return '깔창';
  if(/건조대/.test(s)) return '건조대';
  return s.replace(/^리스페토\s*/,'').replace(/\s*특가.*$/,'').replace(/\s*반품.*$/,'');
}
/* 그 날의 색상별 광고 전환 판매수: bigcell-live.json adOption → adDetail.campaigns → 내장 확정표 */
function adOptionFor(ds){
  const ov = (S.dailyOverrides||{})[ds] || {};
  const norm = list => {
    const g = {};
    (list||[]).forEach(x=>{ const c = aoColorOf(x && x.name); if(!c) return; g[c] = (g[c]||0) + (Number(x.adQty)||0); });
    const out = AO_COLOR_ORDER.filter(c=>g[c]!=null).map(c=>({name:c, adQty:g[c]}));
    return out.length ? out : null;
  };
  if(Array.isArray(ov.adOption) && ov.adOption.length){ const r = norm(ov.adOption); if(r) return r; }
  if(ov.adDetail && Array.isArray(ov.adDetail.campaigns) && ov.adDetail.campaigns.length){
    const r = norm(ov.adDetail.campaigns); if(r) return r;
  }
  return AD_OPTION_CONF[ds] || null;
}
/* 색상별 광고 내역 문자열. 합계가 상품 광고 판매수와 정확히 맞을 때만 반환(어중간한 내역은 숨김) */
function aoOptBreakdown(ds, prod, adQty){
  const opt = adOptionFor(ds) || [];
  const colorProd = c => c==='깔창' ? '깔창' : '건조대';
  const rows = opt.filter(x=> colorProd(x.name)===prod && x.name!==prod);
  if(!rows.length) return '';
  const sum = rows.reduce((a,x)=> a + (Number(x.adQty)||0), 0);
  if(adQty!=null && sum !== Number(adQty)) return '';
  return rows.slice().sort((a,b)=> b.adQty-a.adQty).map(x=>`${x.name} ${x.adQty}`).join('·');
}
/* 광고/자연 배지 바로 밑에 붙는 품목별 내역. 확정 전(오늘)이면 색상별 판매수량만 보여준다. */
function aoItemsHTML(ds, r, o){
  o = o || {};
  if(!r || r.qty==null) return '';
  const items = itemRowsFor(ds) || [];
  if(!items.length) return '';
  const g = {}, colors = {};
  items.forEach(x=>{
    const k = aoProdOf(x.name);
    if(!k) return;
    const b = g[k] || (g[k] = {name:k, qty:0, adQty:null, organicQty:null});
    b.qty += (Number(x.qty)||0);
    if(x.adQty!=null) b.adQty = (b.adQty==null?0:b.adQty) + (Number(x.adQty)||0);
    if(x.organicQty!=null) b.organicQty = (b.organicQty==null?0:b.organicQty) + (Number(x.organicQty)||0);
    const c = aoColorOf(x.name);
    if(c) colors[c] = (colors[c]||0) + (Number(x.qty)||0);
  });
  const list = Object.keys(g).map(k=>g[k]).sort((a,b)=> (b.adQty!=null?b.adQty:b.qty) - (a.adQty!=null?a.adQty:a.qty));
  if(!list.length) return '';
  const hasAd = list.some(x=>x.adQty!=null);
  const hasOg = list.some(x=>x.organicQty!=null);
  const sep = '<span class="sep">|</span>';
  if(!hasAd && !hasOg){
    const cKeys = AO_COLOR_ORDER.filter(c=>colors[c]!=null);
    const parts = cKeys.length
      ? cKeys.map(c=>`<b>${c}</b> ${colors[c]}`)
      : list.map(x=>`<b>${x.name}</b> ${x.qty}`);
    return `<div class="ao-items${o.right?' right':''}"><div class="ln pk"><span class="em">📦 판매</span>${parts.join(sep)}</div></div>`;
  }
  const adLine = hasAd ? `<div class="ln ad"><span class="em">📣 광고</span>${
    list.filter(x=>x.adQty!=null).map(x=>{
      const o2 = aoOptBreakdown(ds, x.name, x.adQty);
      return `<b>${x.name}</b> ${x.adQty}${o2?` <span class="opt">(${o2})</span>`:''}`;
    }).join(sep)}</div>` : '';
  const ogLine = hasOg ? `<div class="ln og"><span class="em">🌿 자연</span>${
    list.filter(x=>x.organicQty!=null).map(x=>`<b>${x.name}</b> ${x.organicQty}`).join(sep)}</div>` : '';
  return `<div class="ao-items${o.right?' right':''}">${adLine}${ogLine}</div>`;
}

/* 날짜 한 줄 렌더 (행별 🔄 재수집 버튼 포함) — 행 단위 갱신에서도 그대로 재사용 */
function reportRowHTML(rows, r){

    <td class="num">${wonW(r.profit)}<div style="font-size:11px">${cellDelta('profit')}</div></td>
    <td class="num">${wonW(r.ad)}<div style="font-size:11px">${cellDelta('ad')}</div></td>

    <td class="num rfx-cell"><button type="button" class="rfx-row" data-act="rowRefresh" data-d="${r.d}" title="${r.d} 매출만 다시 불러오기 · 쿠팡(윙·광고센터) 재수집 요청 문구" aria-label="${fmtDate(r.d)} 날짜 행 새로고침">🔄</button></td>
  </tr>`;
}
function reportCard(rows){

    <div class="card-b ${opt.repMode==='table'?'flush':''}">${opt.repMode==='table'?table:chart}</div>

/* ---- 날짜별 광고 · 자연 판매수 (상단 요약 칸) ---- */

    const hasAdData = items.some(x=>x.adQty!=null);
    const chips = items.length ? (hasAdData
      ? `<tr class="ao-items-row"><td colspan="5"><div class="ao-chipwrap">${

      <td class="num">${has?`<span class="aob og">🌿 자연 <b>${r.organicQty}</b><span class="pct">${pct1(op)}%</span></span>`:'<span class="flat">—</span>'}</td>

    </tr>` : '';
  return `<div class="card" style="margin-bottom:14px">
    ${sectionHead('📊 날짜별 광고 · 자연 판매수', `${fmtDate(AO_START)} 이후 · 최신순 자동 갱신`,
      `<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">${refreshButtonsHTML()}<div class="ao-lg"><span><i class="ad"></i>광고</span><span><i class="og"></i>자연</span></div></div>`)}
    <div class="tbl-wrap"><table class="tbl ao-tbl">
      <thead><tr><th class="l">날짜</th><th>총 판매수</th><th>광고<span class="ao-w"> 판매수</span><span class="ao-sub"> (비중)</span></th><th>자연<span class="ao-w"> 판매수</span><span class="ao-sub"> (비중)</span></th><th>상태</th></tr></thead>
      <tbody>${body || '<tr><td class="l" colspan="5"><span class="flat">표시할 판매수 데이터가 없습니다.</span></td></tr>'}${totalRow}</tbody>
    </table></div>
    <div class="card-b" style="border-top:1px solid var(--line2)"><div class="hint">광고 판매수 = 쿠팡 광고센터 <b>광고 전환 판매수</b>(익일 확정) · 자연 판매수 = 총 판매수 − 광고 판매수 · 날짜 밑 칩은 그날 팔린 <b>품목(건조대 · 깔창)</b>별 판매수이며, 색상(올화이트·올크림·올블랙) 광고 전환은 확정된 날만 같이 표기합니다 · <code>bigcell-live.json</code>의 daily 데이터가 늘어나면 이 칸도 자동으로 늘어납니다.</div></div>
  </div>`;
}

/* ---- 💸 고정지출비용 (이번달 매출 KPI 바로 아래) ---- */
/* 이번달 현 순수익 = 빅셀 확정 순이익(오늘 이전) + 오늘 실시간 잠정 순수익. 수집이 갱신되면 같이 바뀐다. */
function fixedCostNums(){
  const rows = dailySeries();
  const liveDate = (S.live && S.live.date) || null;
  const month = liveDate ? String(liveDate).slice(0,7) : opt.calMonth;
  const mRows = rows.filter(r=> r.d.startsWith(month) && r.net!=null);
  const conf = mRows.filter(r=> r.d!==liveDate);
  const today = mRows.filter(r=> r.d===liveDate);
  const confNet = conf.reduce((a,r)=>a+r.net, 0);
  const todayNet = today.reduce((a,r)=>a+r.net, 0);
  return {month, confNet, todayNet, now: confNet + todayNet,
    confDays: conf.length, confFrom: conf.length?conf[0].d:null, confTo: conf.length?conf[conf.length-1].d:null,
    hasToday: today.length>0, liveDate};
}
function fixedCostCard(){
  const n = fixedCostNums();
  const list = Array.isArray(S.fixedCosts) ? S.fixedCosts : [];
  const total = fcTotalOf();
  const fin = n.now - total;
  const rows = list.map(x=>`<tr>
      <td class="l"><input class="inp fc-name" type="text" data-fc-id="${esc(x.id)}" data-fc-field="name" value="${esc(x.name||'')}" placeholder="항목명 (예: 창고 월세)" aria-label="고정지출 항목명"></td>
      <td class="num"><input class="inp fc-amt" type="number" min="0" step="1000" data-fc-id="${esc(x.id)}" data-fc-field="amount" value="${Number(x.amount)||0}" aria-label="고정지출 금액(원)"> <span class="fc-won">원</span></td>
      <td class="num"><button type="button" class="fc-del" data-act="fcDel" data-fc-id="${esc(x.id)}" title="이 항목 삭제" aria-label="${esc(x.name||'항목')} 삭제">✕</button></td>
    </tr>`).join('');
  const fromTo = n.confFrom ? `${fmtDate(n.confFrom)}~${fmtDate(n.confTo)}` : '확정치 없음';
  return `<div class="card fc-card">
    ${sectionHead('💸 고정지출비용', '창고 월세 · 알바비 등 매달 나가는 고정비', `<span class="pill" id="fcPill">합계 ${won(total)}원</span>`)}
    <div class="tbl-wrap"><table class="tbl fc-tbl">
      <thead><tr><th class="l">항목명</th><th>금액(원)</th><th class="fc-th-del">삭제</th></tr></thead>
      <tbody>${rows || '<tr><td class="l fc-row-empty" colspan="3">등록된 고정지출이 없습니다. 아래 <b>+ 항목 추가</b>로 넣어 주세요.</td></tr>'}</tbody>
    </table></div>
    <div class="fc-add"><button type="button" class="btn" data-act="fcAdd">+ 항목 추가</button></div>
    <div class="fc-eq">
      <span class="fc-term"><span class="k">이번달 현 순수익 <span class="fc-tag ${fin<0?'neg':'pos'}" id="fcTag">${fin<0?'적자':'흑자'}</span></span><b class="num" id="fcMonthNet" data-v="${n.now}">${won(n.now)}원</b></span>
      <span class="fc-op">−</span>
      <span class="fc-term"><span class="k">고정지출 합계</span><b class="num" id="fcTotal">${won(total)}원</b></span>
      <span class="fc-op">=</span>
      <span class="fc-term res"><span class="k">최종 실순수익</span><b class="num ${fin<0?'neg':'pos'}" id="fcFinal">${(fin<0?'−':'+')+won(Math.abs(fin))}원</b></span>
    </div>
    <div class="fc-note">이번달 현 순수익 <b>${won(n.now)}원</b> = 빅셀 확정 순이익 <b>${won(n.confNet)}원</b>(${fromTo} 확정 ${n.confDays}일)${n.hasToday?` + 오늘 ${fmtDate(n.liveDate)} 실시간 잠정 순수익 <b>${won(n.todayNet)}원</b>`:''} · <code>bigcell-live.json</code> 수집·갱신 때마다 자동으로 바뀝니다. 입력한 고정지출은 이 브라우저에 저장되어 새로고침·데이터 재수집에도 그대로 남습니다.</div>
  </div>`;
}

/* ---- 재고 미니 ---- */
function stockMiniCard(){

    <div class="tbl-wrap"><table class="tbl">

      <tbody>${list.map(p=>{
        const s = byId[p.id];

          <td class="num">${s.keep?'₩'+won(s.keep):'<span class="flat">₩0</span>'}</td>

}

<script>
/* ============================== 2. 일자별 실적 ============================== */
VIEWS.daily = function(){
  const all = dailySeries();
  const n = opt.dailyRange==='all' ? all.length : Number(opt.dailyRange);
  const rows = all.slice(-n);
  const rate = sumOf(rows,'sales') ? sumOf(rows,'profit')/sumOf(rows,'sales')*100 : 0;
  const adRate = sumOf(rows,'sales') ? sumOf(rows,'ad')/sumOf(rows,'sales')*100 : 0;
  return topbar('일자별 실적','매출 · 이익금 · 광고비 · 순이익금 추이',
    `${refreshButtonsHTML()}
    <div class="seg">${[['7','7일'],['14','14일'],['30','30일'],['all','전체']].map(([v,l])=>`<button class="${opt.dailyRange===v?'on':''}" data-act="dailyRange" data-v="${v}">${l}</button>`).join('')}</div>`)
  + `<div class="kpis" style="margin-bottom:14px">
      ${kpiCard('기간 매출', won(sumOf(rows,'sales'))+'원', `<span class="flat">${rows.length}일</span>`)}
      ${kpiCard('기간 이익금', won(sumOf(rows,'profit'))+'원', `<span class="flat">이익률 <b>${pct1(rate)}%</b></span>`)}
      ${kpiCard('기간 광고비', won(sumOf(rows,'ad'))+'원', `<span class="flat">광고비율 <b>${pct1(adRate)}%</b></span>`)}
      ${kpiCard('기간 순이익금', won(sumOf(rows,'net'))+'원', `<span class="flat">순이익률 <b>${pct1(rate-adRate)}%</b></span>`, {accent:true})}
    </div>`
  + `<div class="card">${sectionHead('매출 추이','', `<button class="btn" data-act="csvDaily">⬇ CSV</button>`)}
      <div class="card-b">${legend(['sales','profit','ad','net'],['매출','이익금','광고비','순이익금'])}${lineChart(rows,['sales','profit','ad','net'],{step:500000})}</div>
    </div>`
  + `<div class="card" style="margin-top:14px">${sectionHead('일자별 데이터','빅셀 대시보드 매출 보고서와 동일 산식')}
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th class="l">날짜</th><th>요일</th><th>판매수</th><th>매출</th><th>전일대비</th><th>이익금</th><th>광고비</th><th>순이익금</th><th>이익률</th><th>광고비율</th></tr></thead>
        <tbody>${rows.slice().reverse().map(r=>{
          const i = all.indexOf(r), p = all[i-1];
          const er = r.sales? r.profit/r.sales*100:0, ar = r.sales? r.ad/r.sales*100:0;
          return `<tr>
            <td class="l"><b>${r.d}</b>${r.live?' <span class="tag live">LIVE</span>':''}${r.estimate?' <span class="tag estimate">추정</span>':''}</td>
            <td>${DOW[dateObj(r.d).getDay()]}</td>
            ${qtySplitCell(r)}
            <td class="num">${won(r.sales)}</td>
            <td class="num">${deltaHTML(p?deltaPct(r.sales,p.sales):null)}</td>
            <td class="num">${won(r.profit)}</td>
            <td class="num">${won(r.ad)}</td>
            <td class="num"><b>${won(r.net)}</b></td>
            <td class="num">${pct1(er)}%</td>
            <td class="num">${pct1(ar)}%</td>
          </tr>`;
        }).join('')}
        <tr class="total"><td class="l">합계</td><td></td>${qtySplitTotalCell(rows)}<td class="num">${won(sumOf(rows,'sales'))}</td><td></td><td class="num">${won(sumOf(rows,'profit'))}</td><td class="num">${won(sumOf(rows,'ad'))}</td><td class="num">${won(sumOf(rows,'net'))}</td><td class="num">${pct1(rate)}%</td><td class="num">${pct1(adRate)}%</td></tr>
        </tbody>
      </table></div>
      <div class="card-b" style="border-top:1px solid var(--line2)"><div class="formula"><b>계산 산식</b><br>순이익금 = <code>이익금 − 광고비</code> · 이익률 = <code>이익금 ÷ 매출</code> · 광고비는 VAT 포함 금액<br>판매수 = <code>광고 판매수 + 자연 판매수</code> · 광고 판매수는 쿠팡 광고센터 <b>광고 전환 판매수</b>(익일 확정) · 자연 판매수 = 전체 − 광고</div></div>
    </div>`
  + monthlyCard(all);
};
function monthlyCard(all){
  const g = {};
  all.forEach(r=>{ const k = r.d.slice(0,7); if(!g[k]) g[k] = {m:k, sales:0, profit:0, ad:0, net:0, days:0}; g[k].sales += (r.sales||0); g[k].profit += (r.profit||0); g[k].ad += (r.ad||0); g[k].net += (r.net||0); g[k].days++; });
  const ms = Object.keys(g).sort().reverse();
  return `<div class="card" style="margin-top:14px">${sectionHead('월별 요약','월 단위 매출·이익금·광고비·순이익금')}
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th class="l">월</th><th>집계 일수</th><th>매출</th><th>일평균 매출</th><th>이익금</th><th>광고비</th><th>순이익금</th><th>이익률</th><th>광고비율</th></tr></thead>
      <tbody>${ms.map(k=>{ const r = g[k]; return `<tr>
        <td class="l"><b>${k.slice(0,4)}년 ${Number(k.slice(5))}월</b></td>
        <td class="num">${r.days}일</td>
        <td class="num">${wonW(r.sales)}</td>
        <td class="num">${wonW(Math.round(r.sales/r.days))}</td>
        <td class="num">${wonW(r.profit)}</td>
        <td class="num">${wonW(r.ad)}</td>
        <td class="num"><b>${wonW(r.net)}</b></td>
        <td class="num">${pct1(r.sales?r.profit/r.sales*100:0)}%</td>
        <td class="num">${pct1(r.sales?r.ad/r.sales*100:0)}%</td></tr>`; }).join('')}
      </tbody></table></div>
    <div class="card-b" style="border-top:1px solid var(--line2)"><div class="hint">현재는 11월 데이터만 수집되어 있습니다. 매달 아래에 자동으로 쓸립니다.</div></div>
  </div>`;
}

/* ============================== 3. 상품 · 마진 ============================== */
VIEWS.products = function(){
  const vis = visibleProducts();
  const hidN = PRODUCTS.length - vis.length;
  const rows = vis.map(p=>({p, m: margin(p)}));
  const totalProfit = rows.reduce((a,r)=>a+r.m.profit*r.p.soldM,0);
  return topbar('상품 · 마진','원가를 바꾸면 이익금·마진이 즉시 다시 계산됩니다 (자동 저장)',
    `<button class="btn primary" data-act="resetCosts">원가 초기화</button>`)
  + `<div class="card">
      ${sectionHead('로켓그로스 상품 마진표', `11월 누적 판매량 기준${hidN?` · 숨김 ${hidN}개 제외`:''}`, `<span class="note">클릭해서 수정 → 이익금 자동계산</span>`)}
      <div class="tbl-wrap"><table class="tbl" id="marginTbl">
        <thead><tr><th class="l">상품</th><th>판매가</th><th>할인</th><th>수수료%</th><th>원가</th><th>입출고</th><th>배송비</th><th>개당 이익금</th><th>이익률</th><th>월 판매</th><th>월 이익금</th></tr></thead>
        <tbody>${rows.map(({p,m})=>`<tr>
          <td class="l"><div class="prod"><span class="thumb">${p.icon}</span><div><div class="nm">${esc(p.short)}</div><div class="cd">${p.sku?'SKU '+esc(p.sku)+' · ':''}${p.id}</div></div></div></td>
          ${['price','disc','fee','cost','inout','ship'].map(f=>`<td class="num"><input class="inp num" style="width:${f==='price'?'84px':'68px'};padding:5px 7px" type="number" value="${m[f]}" data-cost-id="${p.id}" data-field="${f}" step="${f==='fee'?'0.01':'1'}"></td>`).join('')}
          <td class="num"><b style="color:${m.profit>0?'var(--ink)':'var(--up)'}">${wonW(m.profit)}</b></td>
          <td class="num">${pct1(m.rate)}%</td>
          <td class="num">${won(p.soldM)}</td>
          <td class="num"><b>${wonW(m.profit*p.soldM)}</b></td>
        </tr>`).join('')}
        <tr class="total"><td class="l">합계 (월 누적 판매량 기준)</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td class="num">${won(vis.reduce((a,p)=>a+p.soldM,0))}</td><td class="num">${wonW(totalProfit)}</td></tr>
        </tbody>
      </table></div>
      <div class="card-b" style="border-top:1px solid var(--line2)">
        <div class="formula">
          <b>로켓그로스 산식 (빅셀 실데이터 검증 완료)</b><br>
          이익금 = <code>(판매가 − 할인) × (1 − 수수료%)</code> − <code>원가</code> − <code>입출고비</code> − <code>배송비</code><br>
          이익률 = <code>이익금 ÷ 판매가</code> · 입출고비·배송비는 VAT 포함<br>
          <span class="hint">예: 신발깔장 (10,790−800)×0.8845 = 8,836 → −2,364 −1,100 −1,485 = <b>3,887원</b></div>
        </div>
    </div>`
  + `<div class="two" style="margin-top:14px">${simulatorCard()}${calcCard()}</div>`
  + `${p3pCard()}`;
};

function simulatorCard(){
  const vis = visibleProducts();

/* ============================== 5. 정산 · 손익 ============================== */
function settleCalc(s){
  const target = s.sales - (s.couponNow||0) - (s.couponDl||0) - (s.fee||0);
  const actual = target - ((s.inout||0) + (s.ship||0) + (s.keep||0) + (s.retCollect||0) + (s.retIn||0)
    + (s.outbound||0) + (s.barcode||0) + (s.fcl||0) + (s.milk||0)) + (s.loss||0) - (s.ad||0);
  const net = actual - (s.cost||0);
  return {target, actual, net};
}
function settleCell(s, c){
  c = c || {};
  const v = s[c.k];
  if(v==null) return '<span class="flat">-</span>';
  if(c.kind==='int') return v===0 ? '<span class="flat">0</span>' : won(v);
  const n = Number(v);
  if(!n) return '<span class="flat">0</span>';
  const txt = n<0 ? '−'+won(Math.abs(n)) : won(n);
  if(c.strong) return `<b class="${n<0?'up':''}">${txt}</b>`;
  return n<0 ? `<span class="up">${txt}</span>` : txt;
}

async function fetchSyncJson(url){
  const m = String(url||'').match(/^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+?)(?:\?.*)?$/);
  if(m){
    try{
      const api = `https://api.github.com/repos/${m[1]}/${m[2]}/contents/${m[4]}?ref=${encodeURIComponent(m[3])}&t=${Date.now()}`;
      const r = await fetch(api, {cache:'no-store'});
      if(r.ok){
        const meta = await r.json();
        if(meta && meta.content){
          const txt = decodeURIComponent(escape(atob(String(meta.content).replace(/\s+/g,''))));
          return JSON.parse(txt);
        }
      }
    }catch(_){}
  }
  const sep = url.includes('?') ? '&' : '?';
  const res = await fetch(url + sep + 't=' + Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}
async function fetchLatest(showMsg){
  if(!S.apiUrl){ if(showMsg) alert('설정에서 자동 수집 엔드포인트를 먼저 입력하세요.'); return; }
  try{
    const j = await fetchSyncJson(S.apiUrl);
    if(j.live) S.live = applyLive(j.live, S.live);
    if(Array.isArray(j.daily)) j.daily.forEach(x=>{ if(x && x.d){
      const o = Object.assign({}, x);
      const c = couponNum(o.coupon), n = couponNum(o.netSales);
      if(c==null && n!=null) o.coupon = Math.max(0, (Number(o.sales)||0)-n);
      if(n==null && c!=null) o.netSales = Math.max(0, (Number(o.sales)||0)-c);
      S.dailyOverrides[x.d] = Object.assign({}, S.dailyOverrides[x.d], o);
    } });
    save(); render();
    if(showMsg) alert('동기화 완료: ' + new Date().toLocaleTimeString('ko-KR'));
  }catch(e){
    if(showMsg) alert('동기화 실패: ' + e.message);
  }
}

function memoForm(ds, key){

    </div></div></div>`;
  const root = document.getElementById('modalRoot') || (()=>{ const d = document.createElement('div'); d.id='modalRoot'; document.body.appendChild(d); return d; })();
  root.innerHTML = html;
  const close = ()=> root.innerHTML='';
  document.getElementById('mClose').onclick = ()=>{ close(); render(); };
  document.getElementById('mCancel').onclick = ()=>{ close(); render(); };

    if(!title && !body){ alert('제목이나 내용을 입력하세요.'); return; }

    save(); close(); render();
  };
}

/* ============================== ⚡ 실시간 순수익 조회 & 즉시 반영 ============================== */
const LP_MIX = [{id:'8188501167'}, {id:'9701805278'}];   // 건조대 · 신발깔창
let LP = null;

function lpNow(){ const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function lpDefaults(){
  const l = S.live || {};
  const qty = Number(l.qty) || 0;
  const est = estCoupon(qty, COUPON_DEFAULT_MIX.mix1, COUPON_DEFAULT_MIX.mix2);
  const hasC = couponNum(l.coupon)!=null;
  return {
    date: l.date || '2026-11-18',
    sales: Number(l.sales) || 0,
    qty: qty,
    adExVat: Number(l.adExVat) || 0,
    vatMode: 'ex',          // ex = VAT 별도 입력 / inc = VAT 포함 입력
    rateMode: 'mix',        // mix = 상품 비중 가중 / avg = 평균 마진율 직접
    mix1: COUPON_DEFAULT_MIX.mix1, mix2: COUPON_DEFAULT_MIX.mix2,
    coupon: hasC ? couponNum(l.coupon) : est,
    couponAuto: !hasC || couponNum(l.coupon) === est,   // 수량·비중으로 자동 산출
    avgRate: Math.round(blendedMargin()*10000)/100,
    at: l.at || ''
  };
}
function lpProducts(){
  return LP_MIX.map(x=>{
    const p = PRODUCTS.find(pp=>pp.id===x.id) || PRODUCTS[0];
    const m = margin(p);
    return {p, m, rate: m.price ? m.profit/m.price : 0};
  });
}
function lpBlendRate(){
  if(LP.rateMode==='avg') return clamp(LP.avgRate||0, 0, 90)/100;
  const ps = lpProducts();
  const w1 = Math.max(0, LP.mix1||0), w2 = Math.max(0, LP.mix2||0);
  const tw = w1 + w2;
  if(!tw) return 0;
  return ps.reduce((a,x,i)=> a + ((i===0?w1:w2)/tw) * x.rate, 0);
}
function lpAdInc(){ return Math.round((LP.adExVat||0) * (S.vat||1.1)); }
/* 쿠폰 차감액: 자동이면 판매 수량 × 상품 비중으로, 직접 모드에서는 입력값 */
function lpCouponVal(){
  const c = LP.couponAuto ? estCoupon(LP.qty||0, LP.mix1, LP.mix2) : Math.max(0, Number(LP.coupon)||0);
  LP.coupon = c;
  return c;
}
function lpCalc(){
  const sales = Math.max(0, LP.sales||0);
  const qty = Math.max(0, LP.qty||0);
  const rate = lpBlendRate();
  const adInc = lpAdInc();
  const coupon = Math.min(lpCouponVal(), sales);
  const netSales = Math.max(0, sales - coupon);
  const profit = Math.round(sales*rate);   // 이익률은 쿠폰 전 판매가 기준 → 쿠폰 전 매출에 적용
  const net = profit - adInc;
  return {sales, qty, rate, adInc, coupon, netSales,
    couponRate: sales ? coupon/sales*100 : 0,
    profit, net,
    netRate: sales ? net/sales*100 : 0,
    aov: qty ? sales/qty : null,
    unitProfit: qty ? profit/qty : null,
    unitNetSales: qty ? netSales/qty : null};
}
function lpCouponSumHTML(){
  const c = lpCalc();
  const w = n => won(n);
  return `<div class="l">쿠폰 제외 실매출</div>
    <div class="n num">${w(c.netSales)}원</div>

function bindLivePanel(root){
  const $ = id => document.getElementById(id);
  const refresh = ()=>{
    const c = lpCalc();
    const ci = $('lpCoupon'); if(ci && LP.couponAuto) ci.value = c.coupon;
    const cs = $('lpCoupSum'); if(cs) cs.innerHTML = lpCouponSumHTML();
    const r = $('lpResult'); if(r) r.innerHTML = lpResultInner();
    const h = $('lpRateHint'); if(h) h.innerHTML = lpRateHintHTML();
    const n = $('lpAdNote'); if(n) n.innerHTML = `VAT 포함 <b>${wonW(lpAdInc())}</b>`;
  };
  const nSales = $('lpSales'), nQty = $('lpQty'), nAd = $('lpAd'), nCoupon = $('lpCoupon');
  const numPaste = el => {
    if(!el || !el.addEventListener) return;
    el.addEventListener('paste', ev => {
      const t = (ev.clipboardData && ev.clipboardData.getData('text')) || '';
      if(!/[,.\s₩원]/.test(t)) return;
      ev.preventDefault();
      const v = t.replace(/[^0-9.]/g, '');
      el.value = v;
      el.dispatchEvent(new Event('input'));
    });
  };
  numPaste(nSales); numPaste(nQty); numPaste(nAd); numPaste(nCoupon);
  if(nSales) nSales.oninput = ()=>{ LP.sales = Math.max(0, parseFloat(nSales.value)||0); refresh(); };
  if(nQty) nQty.oninput = ()=>{ LP.qty = Math.max(0, parseFloat(nQty.value)||0); refresh(); };
  const autoBtn = $('lpCouponAuto');
  function syncAutoBtn(){ if(!autoBtn) return; autoBtn.textContent = LP.couponAuto?'자동':'직접'; autoBtn.classList.toggle('off', !LP.couponAuto); }
  if(nCoupon) nCoupon.oninput = ()=>{ LP.coupon = Math.max(0, parseFloat(nCoupon.value)||0); LP.couponAuto = false; syncAutoBtn(); refresh(); };
  if(autoBtn) autoBtn.onclick = ()=>{ LP.couponAuto = true; LP.coupon = estCoupon(LP.qty||0, LP.mix1, LP.mix2); if(nCoupon) nCoupon.value = LP.coupon; syncAutoBtn(); refresh(); };
  if(nAd) nAd.oninput = ()=>{
    const v = Math.max(0, parseFloat(nAd.value)||0);
    LP.adExVat = LP.vatMode==='inc' ? Math.round(v/(S.vat||1.1)) : Math.round(v);
    refresh();
  };
  root.querySelectorAll('#lpVatSeg [data-vat]').forEach(b=>{
    b.onclick = ()=>{
      const m = b.dataset.vat;
      if(m===LP.vatMode) return;
      LP.vatMode = m;
      root.querySelectorAll('#lpVatSeg [data-vat]').forEach(x=>x.classList.toggle('on', x.dataset.vat===m));
      if(nAd) nAd.value = m==='inc' ? lpAdInc() : LP.adExVat;
      refresh();
    };
  });
  function bindRateInputs(){
    const m1 = $('lpMix1'), m2 = $('lpMix2'), av = $('lpAvg');
    if(m1) m1.oninput = ()=>{ LP.mix1 = clamp(parseFloat(m1.value)||0, 0, 100); LP.mix2 = Math.round(100-LP.mix1); if(m2) m2.value = LP.mix2; refresh(); };
    if(m2) m2.oninput = ()=>{ LP.mix2 = clamp(parseFloat(m2.value)||0, 0, 100); LP.mix1 = Math.round(100-LP.mix2); if(m1) m1.value = LP.mix1; refresh(); };
    if(av) av.oninput = ()=>{ LP.avgRate = clamp(parseFloat(av.value)||0, 0, 90); refresh(); };
  }
  bindRateInputs();
  root.querySelectorAll('#lpRateSeg [data-rate]').forEach(b=>{
    b.onclick = ()=>{
      LP.rateMode = b.dataset.rate;
      root.querySelectorAll('#lpRateSeg [data-rate]').forEach(x=>x.classList.toggle('on', x.dataset.rate===LP.rateMode));
      const ctl = $('lpRateCtl'); if(ctl){ ctl.innerHTML = lpRateCtlHTML(); bindRateInputs(); }
      refresh();
    };
  });
  const x = $('lpX'), cl = $('lpClose'), ap = $('lpApply'), cp = $('lpCopy'), sy = $('lpSync');
  if(x) x.onclick = closeModal;
  if(cl) cl.onclick = closeModal;
  if(ap) ap.onclick = lpApply;
  if(cp) cp.onclick = lpCopy;
  if(sy) sy.onclick = ()=> lpSync(false);
  const mask = $('mask'); if(mask) mask.onclick = ev=>{ if(ev.target.id==='mask') closeModal(); };
}
function lpNote(html){ const m = document.getElementById('lpSyncMsg'); if(m) m.innerHTML = html; }
function lpToast(txt){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#101b34;color:#fff;font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:12px;box-shadow:0 12px 30px rgba(9,17,33,.35);z-index:120;max-width:90vw;text-align:center';
  d.textContent = txt;
  document.body.appendChild(d);
  setTimeout(()=>{ d.style.transition='opacity .3s'; d.style.opacity='0'; setTimeout(()=>{ if(d.parentNode) d.parentNode.removeChild(d); }, 320); }, 2200);

async function lpSync(auto){
  if(!S.apiUrl){
    lpNote('자동 수집 엔드포인트가 설정되지 않아 <b>저장된 오늘 실시간 값</b>을 불러왔습니다. 설정 탭에서 JSON 엔드포인트를 등록하면 열 때 자동으로 받아옵니다.');
    if(!auto) lpToast('자동 수집 엔드포인트가 없어 저장된 값을 사용합니다.');
    return;
  }
  lpNote('⏳ 자동 수집 중…');
  try{
    const j = await fetchSyncJson(S.apiUrl);
    let src = j.live || null;
    if(!src && Array.isArray(j.daily)) src = j.daily.find(x=>x && x.d===LP.date) || j.daily[j.daily.length-1] || null;
    if(!src) throw new Error('응답에 live/daily 값이 없습니다');
    if(!src.date && src.d) src.date = src.d;
    if(/^\d{4}-\d{2}-\d{2}$/.test(String(src.date||''))) LP.date = src.date;
    if(src.sales!=null) LP.sales = Math.max(0, Number(src.sales)||0);
    if(src.qty!=null) LP.qty = Math.max(0, Number(src.qty)||0);
    const srcC = couponNum(src.coupon), srcN = couponNum(src.netSales);
    if(srcC!=null){ LP.coupon = srcC; LP.couponAuto = false; }
    else if(srcN!=null){ LP.coupon = Math.max(0, LP.sales - srcN); LP.couponAuto = false; }
    else { LP.coupon = estCoupon(LP.qty, LP.mix1, LP.mix2); LP.couponAuto = true; }
    let adEx = null;
    if(src.adExVat!=null) adEx = Number(src.adExVat);
    else if(src.ad!=null) adEx = Number(src.ad)/(S.vat||1.1);
    if(adEx!=null && !isNaN(adEx)) LP.adExVat = Math.round(adEx);
    LP.at = lpNow();
    openLivePanel(true, true);
    lpNote(`✅ 자동 수집 완료 · <b>${lpNow()}</b> <span class="flat">${esc(S.apiUrl)}</span>`);
    if(!auto) lpToast('최신 값을 불러왔습니다. 반영하려면 [오늘 실적에 반영]을 누르세요.');
  }catch(e){
    lpNote(`⚠️ 자동 수집 실패: ${esc(e.message)} — 저장된 값을 그대로 사용합니다.`);
    if(!auto) lpToast('자동 수집 실패: ' + e.message);
  }
}
function lpApply(){
  const c = lpCalc();
  const date = LP.date;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date))){ alert('기준일을 확인하세요.'); return; }
  const at = lpNow();
  S.live = Object.assign({}, S.live, {date, sales:c.sales, coupon:c.coupon, netSales:c.netSales, qty:c.qty, adExVat:LP.adExVat, at, profit:c.profit, profitEstimate:true});
  if(!DAILY.some(r=>r.d===date)){
    DAILY.push({d:date, sales:0, profit:null, ad:0, live:true});
    DAILY.sort((a,b)=> a.d<b.d ? -1 : (a.d>b.d ? 1 : 0));
  }
  S.dailyOverrides[date] = Object.assign({}, S.dailyOverrides[date], {
    sales:c.sales, coupon:c.coupon, netSales:c.netSales, qty:c.qty, ad:c.adInc, profit:c.profit
  });
  save();
  closeModal();
  render();
  const row = dailySeries().find(r=>r.d===date);
  lpToast(`✓ ${fmtDate(date)} 실적에 반영 — 실매출 ${won(c.netSales)}원 · 순이익 ${won(row?row.net:c.net)}원 · 순이익률 ${pct1(c.netRate)}%`);
}

function lpCopy(){
  const t = lpRequestText();
  const ta = document.getElementById('lpCopyText');
  const done = ()=>{
    if(ta) ta.style.display = 'none';
    lpNote('📋 최신값 요청 문구를 복사했습니다. 채팅창에 붙여넣기만 하면 됩니다.');
    lpToast('요청 문구를 복사했습니다.');
  };
  const manual = ()=>{
    if(!ta) return;
    ta.value = t; ta.style.display = 'block';
    ta.focus(); ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    if(ok) done();
    else lpNote('자동 복사가 안 됩니다. 아래 문구를 길게 눌러 직접 복사하세요.');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(manual);
  } else { manual(); }
}

/* ---------- 원격 JSON 반영 ---------- */
function rfxApplyDaily(list){
  let n = 0;
  (list || []).forEach(x=>{
    if(!x || !x.d) return;
    const o = Object.assign({}, x);
    const c = couponNum(o.coupon), ns = couponNum(o.netSales);
    if(c==null && ns!=null) o.coupon = Math.max(0, (Number(o.sales)||0)-ns);
    if(ns==null && c!=null) o.netSales = Math.max(0, (Number(o.sales)||0)-c);
    S.dailyOverrides[x.d] = Object.assign({}, S.dailyOverrides[x.d], o);
    n++;
  });
  return n;
}
function rfxApplyHistory(daily){
  if(!daily || typeof daily!=='object') return 0;
  let n = 0;
  Object.keys(daily).forEach(d=>{
    const v = daily[d];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d) || !v || v.sales==null) return;
    const ad = (v.ad!=null) ? Number(v.ad)||0 : 0;
    let net = (v.net!=null) ? Number(v.net) : ((v.profit!=null) ? Number(v.profit)-ad : null);
    HIST[d] = [Number(v.sales)||0, ad, net];
    n++;
  });
  return n;
}
function rfxApplyWing(w){
  if(!w || typeof w!=='object' || typeof BC7==='undefined' || !BC7.wing) return 0;
  ['updatedAt','source','sales','qty','prices','stock','changed','note'].forEach(k=>{ if(w[k]!=null) BC7.wing[k] = w[k]; });
  return 1;
}
function rfxApplyProducts(p){
  if(!p || typeof p!=='object' || typeof BC7==='undefined') return 0;
  let n = 0;
  if(Array.isArray(p.rfm) && p.rfm.length){ BC7.rfm = p.rfm; n++; }
  if(Array.isArray(p.p3p) && p.p3p.length){ BC7.p3p = p.p3p; n++; }
  if(p.discountHistory && typeof p.discountHistory==='object'){ BC7.dh = p.discountHistory; n++; }
  if(p.costHistory && typeof p.costHistory==='object'){ BC7.ch = p.costHistory; n++; }
  if(p.collectedAt) BC7.collectedAt = p.collectedAt;
  /* 대시보드 상품 마스터(재고·마진)의 판매가·할인가·수수료·원가·입출고·배송비도 최신값으로 */
  if(Array.isArray(p.rfm)){
    p.rfm.forEach(x=>{
      const hit = PRODUCTS.find(y=>y.id===x.pid);
      if(!hit) return;
      ['name','short','icon','price','disc','fee','cost','inout','ship'].forEach(k=>{ if(x[k]!=null) hit[k] = x[k]; });
      if(x.hidden!=null) hit.hidden = !!x.hidden;   /* bigcell-products.json 의 숨김 기본값 */
    });
  }
  return n;
}
function rfxApplyAll(res){
  const info = {live:0, days:0, hist:0, wing:0, products:0, updatedAt:''};
  if(res.live){
    if(res.live.live){ S.live = applyLive(res.live.live, S.live); info.live = 1; }
    if(Array.isArray(res.live.daily)) info.days = rfxApplyDaily(res.live.daily);
    if(res.live.wingPrices) info.wing = rfxApplyWing(res.live.wingPrices);
    info.updatedAt = String(res.live.updatedAt || '');
  }
  if(res.hist) info.hist = rfxApplyHistory(res.hist.daily);
  if(res.prod) info.products = rfxApplyProducts(res.prod);
  return info;
}
async function rfxFetchAll(){
  const t = Date.now();
  const urls = {live:RFX.liveUrl, hist:RFX.histUrl, prod:RFX.prodUrl};
  const res = {}, fails = [];
  const label = {live:'빅셀 실시간', hist:'일자별 캘린더', prod:'상품·윙' };
  await Promise.all(Object.keys(urls).map(async k=>{
    const base = urls[k];
    const url = base + (base.indexOf('?')>=0?'&':'?') + 't=' + t;
    try{ res[k] = await fetchSyncJson(url); }
    catch(e){ fails.push(label[k] + ' (' + ((e && e.message) || '실패') + ')'); }
  }));
  return {res, fails};
}
function rfxStamp(info){
  const t = (info && info.updatedAt) ? String(info.updatedAt) : '';
  if(t.length >= 16) return t.slice(11,16);
  if(/^\d{2}:\d{2}$/.test(t)) return t;
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function rfxMonth(){ return (opt && opt.calMonth) ? opt.calMonth : String((S.live && S.live.date) || '').slice(0,7); }
function rfxMonthSummary(m){
  const rows = dailySeries().filter(r=>r.d && r.d.indexOf(m)===0);
  return {
    days: rows.length,
    sales: rows.reduce((a,r)=>a+netSalesOf(r), 0),
    profit: sumOf(rows,'profit'),
    ad: sumOf(rows,'ad'),
    net: rows.reduce((a,r)=>a+(r.net!=null?r.net:0), 0)
  };
}

ACTIONS.monthRecollect = async function(){
  if(RFX.busy) return;
  const m = rfxMonth();
  const before = rfxMonthSummary(m);
  rfxSetBusy(true);
  try{
    const {res, fails} = await rfxFetchAll();
    const info = rfxApplyAll(res);
    /* 원가·할인가 규칙(S.segments)이 있으면 이번 달 전일 이익금을 구간 기준으로 다시 계산 */
    if(!S.segments) S.segments = {};
    clearSegCache(); save();
    RFX.lastFails = fails;
    RFX.lastAt = rfxStamp(info);
    rfxSetBusy(false); render();
    const after = rfxMonthSummary(m);
    rfxRecollectModal(m, after, before, fails, info);
  }catch(e){
    rfxSetBusy(false);
    toast('이번달 재수집 실패', 'err', esc((e && e.message) || '알 수 없는 오류'));
  }
};

const bcEsc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bcNum = v => (v==null || v==='' || isNaN(Number(v))) ? null : Number(v);

function bcOpt(pid){
  const p = BC7.rfm.find(x=>x.pid===pid);
  if(!p) return [];
  return p.options.map(o=>{
    const ov = S.pm.ov[o.optId] || {};
    const m = Object.assign({}, o, ov);
    const wp = BC7.wing.prices[o.optId];
    const wingDiff = (wp!=null && wp !== m.price);
    if(wingDiff) m.price = wp;                    // 윙 최신 판매가 우선 반영
    m.wingDiff = wingDiff;
    return m;
  });
}
function bcCalc(o){
  const price = bcNum(o.price)||0, disc = bcNum(o.disc)||0;
  const fee = bcNum(o.fee)||0, cost = bcNum(o.cost)||0;
  const inout = bcNum(o.inout)||0, ship = bcNum(o.ship)||0;
  const base = price - disc;
  const feeAmt = Math.round(base*fee/100);     /* 빅셀은 수수료를 원단위 반올림 */
  const profit = base - feeAmt - cost - inout - ship;
  const pct = price ? profit/price*100 : 0;
  return {price, disc, fee, cost, inout, ship, base, feeAmt, profit, pct};
}
function bcProdRow(p){
  const os_ = bcOpt(p.pid);
  const rep = os_.find(o=>o.state==='일반상품') || os_[0] || {price:p.price,disc:p.disc,fee:p.fee,cost:p.cost,inout:p.inout,ship:p.ship};
  const c = bcCalc(rep);
  return {p, opts:os_, rep, c, normals: os_.filter(o=>o.state==='일반상품').length,
          missCost: os_.filter(o=>o.cost==null).length};
}
function bcWingChangedCount(){
  let n=0;
  BC7.rfm.forEach(p=>p.options.forEach(o=>{
    const wp = BC7.wing.prices[o.optId];
    const cur = (S.pm.ov[o.optId]||{}).price;
    const base = cur!=null ? cur : o.price;
    if(wp!=null && wp!==base) n++;
  }));
  return n;
}
function bcHist(pid){
  if(Array.isArray(S.pm.dh[pid])) return S.pm.dh[pid];
  return (BC7.dh[pid]||[]).map(r=>Object.assign({}, r));
}
function bcCostHist(pid){
  if(Array.isArray(S.pm.ch[pid])) return S.pm.ch[pid];
  return (BC7.ch[pid]||[]).map(r=>Object.assign({}, r));
}
function bcMoney(n){
  if(n==null || isNaN(n)) return '-';
  const v = Math.round(n);
  return (v<0 ? '-₩' : '₩') + Math.abs(v).toLocaleString('ko-KR');
}

      <td class="r"><button class="pen" data-act="discOpen" data-id="${r.p.pid}" title="할인가 설정">✏️</button><span class="num">${bcMoney(c.disc)}</span></td>
      <td class="r num ${c.profit<0?'neg':''}">${bcMoney(c.profit)}<span class="pct">(${c.pct.toFixed(2)}%)</span></td>
      <td class="r num">${c.fee}%</td>
      <td class="r"><button class="pen" data-act="costOpen" data-id="${r.p.pid}" title="원가 입력 히스토리">✏️</button><span class="num">${bcMoney(c.cost)}</span></td>
      <td>${isHidden(r.p.pid)?'<span class="pill warn">숨김</span>':'<span class="pill ok">운영중</span>'}</td>
      <td class="prodact">${isHidden(r.p.pid)
        ? `<button class="show" data-act="pmHide" data-id="${r.p.pid}">복원</button>`

        <tbody>${optRows}</tbody></table></td></tr>` : '');

  return topbar('로켓그로스 상품관리', `리스페토 · 상품 ${BC7.rfm.length}개(운영 ${runN} · 숨김 ${hidN}) · 옵션 ${totOpts}개 · 빅셀 수집 ${BC7.collectedAt}`,
