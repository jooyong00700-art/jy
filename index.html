       <button class="btn" data-act="pmExport">⬇ 엑셀 다운로드</button>`)
  + `<div class="alert info" style="margin-bottom:12px">* 입출고요금과 배송비는 별도로 구분되어 있으며, 부가세가 포함된 금액입니다. <b>빅셀 로켓그로스 상품 관리</b> 구조 그대로입니다.</div>
  <div class="wingbar">
    <span class="wtag">🔄 윙 판매가 자동 반영</span>
    <span>${wingCh ? `<b>${wingCh}개 옵션</b>의 판매가를 쿠팡 윙 최신값으로 바꿔 계산했습니다.` : `쿠팡 윙 판매가와 빅셀 판매가가 <b>10개 옵션 모두 일치</b>(변경 0건)`}</span>
    <span class="sep">·</span>
    <span>윙 오늘 매출 <b class="num">${won(BC7.wing.sales)}원</b> · 판매 <b class="num">${BC7.wing.qty}개</b> (${esc(BC7.wing.updatedAt)})</span>
    <span class="spacer"></span>
    <span class="src">${esc(BC7.wing.source)}</span>
  </div>
  <div class="card" style="margin-bottom:12px"><div class="filterbar">
    <button class="btn">전체선택</button>
    <select class="inp sm" data-act="pmFilter" data-k="store"><option>스토어: 리스</option></select>
    <select class="inp sm" data-act="pmFilter" data-k="market"><option>로켓그로스</option></select>
    <select class="inp sm" data-act="pmFilter" data-k="kind">
      <option value="">상품 종류 선택</option><option value="일반"${opt.pm.kind==='일반'?' selected':''}>일반상품만</option><option value="반품"${opt.pm.kind==='반품'?' selected':''}>반품상품만</option>
    </select>
    <select class="inp sm" data-act="pmFilter" data-k="hide">
      <option value="N"${hideF==='N'?' selected':''}>운영상품 ${runN}</option><option value="Y"${hideF==='Y'?' selected':''}>숨김상품 ${hidN}</option><option value="A"${hideF==='A'?' selected':''}>전체 ${rows.length}</option>
    </select>
    <input class="inp sm grow" id="pmQ" placeholder="노출상품·옵션·SKU ID, 상품명, 옵션명, 담당자" value="${bcEsc(opt.pm.q||'')}">
    <button class="btn dark" data-act="pmSearch">검색</button>
    <label class="chk"><input type="checkbox" data-act="pmFilter" data-k="nocost" ${opt.pm.nocost?'checked':''}> 원가 미입력 상품</label>
    <span class="spacer"></span>
    <button class="btn" data-act="pmExport">📊 엑셀 다운로드</button>
  </div>
  <div class="tbl-wrap"><table class="tbl pm">
    <thead><tr>
      <th style="width:34px"></th><th class="l">노출상품ID</th><th>이미지</th><th class="l">상품명</th><th>구분</th>
      <th class="r">판매가</th><th class="r">할인금액</th><th class="r">이익금(%)</th><th class="r">마켓수수료</th><th class="r">원가</th><th>빅셀상태</th><th>숨김</th>
    </tr></thead>
    <tbody>${body || `<tr><td colspan="12" class="blank">조건에 맞는 상품이 없습니다.</td></tr>`}</tbody>
  </table></div>
  <div class="card-b" style="border-top:1px solid var(--line2); font-size:11.5px; color:var(--muted)">
    판매가·이익금은 옵션별로 다시 계산됩니다(이익금 = (판매가−할인) × (1−수수료%) − 원가 − 입출고 − 배송비). ✏️를 누르면 빅셀과 같은 <b>할인가 설정</b> / <b>원가 입력 히스토리</b> 창이 열립니다. 수정값은 이 브라우저(localStorage)에 저장되고 JSON으로 백업할 수 있습니다.
  </div></div>`
  + `<div class="card" style="margin-top:12px">${sectionHead('숨김 상태', `운영 ${runN} · 숨김 ${hidN} · 빅셀 2026-11-22 숨김상품 목록 기준`)}
    <div class="card-b">
      <div class="alert info">빅셀과 같은 규칙입니다: 숨김 상품은 <b>상품·마진</b>과 <b>재고·품절</b> 목록에서 빠지고, <b>정산서에는 그대로 남습니다</b>(정산은 쿠팡 정산서 원본 기준).</div>
      <div class="toolbar" style="margin-top:10px">
        <button class="btn" data-act="hiddenExport">⬇ 숨김 설정 JSON 내보내기</button>
        <button class="btn" data-act="hiddenReset">↺ 빅셀 기준으로 초기화</button>
        <span class="hint">바꾼 값은 이 브라우저(localStorage)에 저장됩니다. 초기화하면 빅셀 숨김상품 ${PRODUCTS.filter(p=>p.hidden).length}개가 기본값으로 돌아갑니다.</span>
      </div>
    </div>
  </div>`
  + bcModals();
};

/* ---------- 필터 액션 ---------- */
ACTIONS.pmToggle = d=>{ S.pm.open[d.id] = !S.pm.open[d.id]; save(); render(); };
ACTIONS.pmFilter = (d, el)=>{
  const k = d.k;
  if(k==='nocost') opt.pm.nocost = el.checked;
  else opt.pm[k] = el.value;
  if(k==='kind'||k==='hide') render();
};
/* 숨기기 / 복원 — localStorage 저장 */
ACTIONS.pmHide = (d)=>{
  const id = d.id;
  const hide = !isHidden(id);
  if(hide && !confirm('이 상품을 숨길까요?\n\n숨기면 상품·마진 / 재고·품절 목록에서 빠지고, 정산서에는 그대로 남습니다.')) return;
  S.hidden[id] = hide;
  save(); render();
  const p = PRODUCTS.find(x=>x.id===id) || BC7.rfm.find(x=>x.pid===id) || {};
  toast(hide?'상품을 숨겼습니다':'상품을 복원했습니다', hide?'':'ok', (p.short||p.name||id)+' · '+(hide?'숨김':'운영중'));
};
ACTIONS.hiddenExport = ()=>{
  const data = { savedAt:new Date().toISOString(), source:'대시보드 숨김 상태', products:PRODUCTS.map(p=>({id:p.id, short:p.short, hiddenDefault:!!p.hidden, hidden:isHidden(p.id)})) };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bigcell-hidden.json'; a.click();
};
ACTIONS.hiddenReset = ()=>{
  if(!confirm('숨김 상태를 빅셀 기준(숨김 '+PRODUCTS.filter(p=>p.hidden).length+'개)으로 되돌릴깨요?')) return;
  S.hidden = {}; save(); render();
  toast('빅셀 기준으로 초기화했습니다','ok');
};
ACTIONS.pmSearch = ()=>{
  const el = document.getElementById('pmQ');
  opt.pm.q = el ? el.value : '';
  render();
};
ACTIONS.copyId = (d, el)=>{
  try{ navigator.clipboard.writeText(d.id); el.textContent='✓'; setTimeout(()=>el.textContent='⧉',900); }catch(e){}
};
ACTIONS.pmExport = ()=>{
  const rows = [['노출상품ID','SKU ID','옵션ID','상품명','옵션명','구분','판매가','할인금액','마켓수수료%','원가','입출고요금','배송비','이익금','이익금%','빅셀상태']];
  BC7.rfm.forEach(p=>bcOpt(p.pid).forEach(o=>{
    const c = bcCalc(o);
    rows.push([p.pid, o.sku, o.optId, p.name, o.name, o.state, c.price, c.disc, c.fee, c.cost, c.inout, c.ship, c.profit, c.pct.toFixed(2), p.status]);
  }));
  const csv = '\ufeff' + rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = '로켓그로스-상품관리-2026-11-20.csv'; a.click();
};

/* ==================== 2. 할인가 / 원가 모달 ==================== */
function bcModals(){
  const d = opt.pm.dlg;
  if(!d) return '';
  const p = BC7.rfm.find(x=>x.pid===d.pid);
  if(!p) return '';
  const os_ = bcOpt(p.pid);
  const normals = os_.filter(o=>o.state==='일반상품');
  const first = normals[0] || os_[0];
  const optLabel = `${first?first.name:''}${normals.length>1?` 외 ${normals.length-1}개`:''}`;
  if(d.type==='disc') return bcDiscModal(p, normals, optLabel);
  return bcCostModal(p, os_, optLabel);
}

function bcDiscModal(p, normals, optLabel){
  const tab = opt.pm.tab || 'promo';
  const TABS = [['promo','프로모션'],['instant','즉시할인'],['coupon','다운로드쿠폰']];
  const typeName = {promo:'프로모션', instant:'즉시할인', coupon:'다운로드쿠폰'}[tab];
  const hist = bcHist(p.pid);
  const edit = opt.pm.edit;   // {i:index, mode:'edit'}
  const rows = hist.map((r,i)=>{
    const isEdit = edit && edit.i===i;
    if(isEdit){
      return `<tr>
        <td class="l">${bcEsc(r.optId)}</td>
        <td class="l"><input class="inp xs" type="date" data-h="from" value="${(r.from||'').replace(/\//g,'-')}"> – <input class="inp xs" type="date" data-h="to" value="${(r.to||'').replace(/\//g,'-')}"></td>
        <td><select class="inp xs" data-h="type">${['프로모션','즉시할인','다운로드쿠폰'].map(t=>`<option${t===(r.type||'다운로드쿠폰')?' selected':''}>${t}</option>`).join('')}</select></td>
        <td class="r"><input class="inp xs num" type="number" data-h="price" value="${r.price}"></td>
        <td class="r"><input class="inp xs num" type="number" data-h="amt" value="${r.amt}"></td>
        <td class="r num" id="bcSaleCell">${bcMoney((r.price||0)-(r.amt||0))}</td>
        <td><button class="mini on" data-act="histSave" data-i="${i}" data-pid="${p.pid}">저장</button><button class="mini" data-act="histCancel">취소</button></td>
      </tr>`;
    }
    return `<tr>
      <td class="l mono">${bcEsc(r.optId)}</td>
      <td class="l">${r.from==='현재 적용' ? '<span class="tag live">현재 적용 중</span>' : `${bcEsc(r.from)} - ${bcEsc(r.to)}`}</td>
      <td>${bcEsc(r.type||'다운로드쿠폰')}</td>
      <td class="r num">${bcMoney(r.price)}</td>
      <td class="r num">${bcMoney(r.amt)}</td>
      <td class="r num">${bcMoney(r.sale!=null?r.sale:(r.price-r.amt))}</td>
      <td><button class="mini" data-act="histEdit" data-i="${i}">수정</button><button class="mini red" data-act="histDel" data-i="${i}" data-pid="${p.pid}">삭제</button></td>
    </tr>`;
  }).join('');

  return `<div class="bc-mask"><div class="bc-modal">
    <div class="bc-head"><h3>할인가 설정</h3><button class="x" data-act="dlgClose">✕</button></div>
    <div class="bc-body">
      <div class="kv"><span class="k">상품명</span><span class="v">${bcEsc(p.name)}</span></div>
      <div class="kv"><span class="k">옵션명</span><span class="v">${bcEsc(optLabel)}</span></div>
      <h4 class="bc-h4">할인가 입력하기</h4>
      <div class="bc-seg">${TABS.map(([id,label])=>`<button class="seg-btn ${tab===id?'on':''}" data-act="dlgTab" data-tab="${id}">${label}</button>`).join('')}</div>
      <div class="bc-form">
        <div class="fld"><label>기간</label>
          <div class="range"><input class="inp sm" type="date" id="bcFrom" value="2026-11-20"><span>–</span><input class="inp sm" type="date" id="bcTo" value="2027-11-01"></div>
        </div>
        <div class="fld"><label>할인 종류</label>
          <select class="inp sm" id="bcKind"><option value="amt">금액(원)</option><option value="pct">율(%)</option></select>
        </div>
        <div class="fld"><label>${typeName} 금액</label><input class="inp sm num" type="number" id="bcAmt" placeholder="예: 800"></div>
        <div class="fld"><label>적용 대상</label><select class="inp sm" id="bcScope"><option value="all">일반상품 ${normals.length}개 전체</option>${normals.map(o=>`<option value="${o.optId}">${bcEsc(o.name)}</option>`).join('')}</select></div>
        <button class="btn primary" data-act="discAdd" data-pid="${p.pid}">${typeName} 즉시 등록</button>
      </div>
      <h4 class="bc-h4">할인가 히스토리 <span class="note">${hist.length}건 · 최근 기간부터</span></h4>
      <div class="tbl-wrap bc-hist"><table class="tbl">
        <thead><tr><th class="l">옵션ID</th><th class="l">기간</th><th>할인종류</th><th class="r">판매가</th><th class="r">할인금액(율)</th><th class="r">할인판매가</th><th>기능</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="blank">등록된 할인 히스토리가 없습니다.</td></tr>'}</tbody>
      </table></div>
      <div class="bc-foot"><span class="hint">등록하면 위 상품관리 표의 할인금액·이익금이 즉시 다시 계산됩니다. 할인판매가 = 판매가 − 할인금액(자동).</span>
        <span class="spacer"></span><button class="btn" data-act="dlgClose">닫기</button></div>
    </div>
  </div></div>`;
}

function bcCostModal(p, os_, optLabel){
  const hist = bcCostHist(p.pid);
  const edit = opt.pm.edit;
  const rows = hist.map((r,i)=>{
    const isEdit = edit && edit.i===i;
    if(isEdit){
      return `<tr><td class="l"><input class="inp xs" type="date" data-h="date" value="${r.date}"></td>
        <td class="l mono">${bcEsc(r.optId)}</td><td class="l">${bcEsc(r.name)}</td><td>${bcEsc(r.state||'일반상품')}</td>
        <td class="r"><input class="inp xs num" type="number" data-h="cost" value="${r.cost}"></td>
        <td><button class="mini on" data-act="chSave" data-i="${i}" data-pid="${p.pid}">저장</button><button class="mini" data-act="chCancel">취소</button></td></tr>`;
    }
    return `<tr><td class="l">${bcEsc(r.date)}</td><td class="l mono">${bcEsc(r.optId)}</td><td class="l">${bcEsc(r.name)}</td>
      <td>${r.state==='반품'?'<span class="tag gray">반품</span>':'일반상품'}</td><td class="r num">${bcMoney(r.cost)}</td>
      <td><button class="mini" data-act="chEdit" data-i="${i}">수정</button><button class="mini red" data-act="chDel" data-i="${i}" data-pid="${p.pid}">삭제</button></td></tr>`;
  }).join('');
  return `<div class="bc-mask"><div class="bc-modal">
    <div class="bc-head"><h3>원가 입력 히스토리</h3><button class="x" data-act="dlgClose">✕</button></div>
    <div class="bc-body">
      <div class="kv"><span class="k">상품명</span><span class="v">${bcEsc(p.name)}</span></div>
      <div class="kv"><span class="k">옵션명</span><span class="v">${bcEsc(optLabel)}</span></div>
      <h4 class="bc-h4">원가 일괄 적용하기</h4>
      <div class="bc-form">
        <div class="fld"><label>기준 날짜</label><input class="inp sm" type="date" id="bcCostDate" value="2026-11-20"></div>
        <div class="fld"><label>원가 입력</label><input class="inp sm num" type="number" id="bcCostVal" placeholder="예: 2,364"></div>
        <button class="btn primary" data-act="costApply" data-pid="${p.pid}">원가 적용</button>
        <button class="btn" data-act="costClear" data-pid="${p.pid}">원가 삭제</button>
      </div>
      <ul class="bc-guide">
        <li>선택한 기준일자부터 입력하신 원가가 적용됩니다.</li>
        <li>동일한 옵션명의 반품 상품이 있는 경우 원상품의 원가를 변경하면 반품 상품의 원가도 같이 변경됩니다.</li>
        <li>현재 운영하지 않는 상품은 상품관리에서 숨김처리를 권장합니다.</li>
      </ul>
      <h4 class="bc-h4">원가 히스토리 <span class="note">${hist.length}건</span>
        <button class="mini" data-act="chAdd" data-pid="${p.pid}" style="margin-left:8px">＋ 행 추가</button></h4>
      <div class="tbl-wrap bc-hist"><table class="tbl">
        <thead><tr><th class="l">날짜</th><th class="l">옵션ID</th><th class="l">옵션명</th><th>옵션상태</th><th class="r">원가</th><th>기능</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="blank">등록된 원가 히스토리가 없습니다.</td></tr>'}</tbody>
      </table></div>
      <div class="bc-foot"><span class="hint">수정값은 이 브라우저에 저장되고 상품관리 표·매출분석 손익에 즉시 반영됩니다.</span>
        <span class="spacer"></span><button class="btn" data-act="dlgClose">닫기</button></div>
    </div>
  </div></div>`;
}

ACTIONS.discOpen = d=>{ opt.pm.dlg = {type:'disc', pid:d.id}; opt.pm.tab = opt.pm.tab||'promo'; opt.pm.edit=null; render(); };
ACTIONS.costOpen = d=>{ opt.pm.dlg = {type:'cost', pid:d.id}; opt.pm.edit=null; render(); };
ACTIONS.dlgClose = ()=>{ opt.pm.dlg=null; opt.pm.edit=null; render(); };
ACTIONS.dlgTab = d=>{ opt.pm.tab = d.tab; render(); };
ACTIONS.histEdit = d=>{ opt.pm.edit = {i:+d.i}; render(); };
ACTIONS.histCancel = ()=>{ opt.pm.edit = null; render(); };
ACTIONS.histDel = d=>{
  const list = bcHist(d.pid).slice();
  const row = list[+d.i]; if(!row) return;
  if(!confirm(`이 할인 이력을 삭제할까요?\n${row.from} ${row.optId}`)) return;
  list.splice(+d.i,1); S.pm.dh[d.pid] = list; save(); render();
};
ACTIONS.histSave = (d, el)=>{
  const pid = d.pid, i = +d.i;
  const list = bcHist(pid).slice();
  const tr = el.closest('tr');
  const g = k => { const n = tr.querySelector(`[data-h="${k}"]`); return n ? n.value : ''; };
  const row = list[i]; if(!row) return;
  row.from = (g('from')||'').replace(/-/g,'/');
  row.to = (g('to')||'').replace(/-/g,'/');
  row.type = g('type') || row.type;
  row.price = Number(g('price')) || row.price;
  row.amt = Number(g('amt')) || 0;
  row.sale = row.price - row.amt;
  S.pm.dh[pid] = list;
  const o = BC7.rfm.find(p=>p.pid===pid).options.find(x=>x.optId===row.optId);
  if(o){ S.pm.ov[row.optId] = Object.assign({}, S.pm.ov[row.optId], {disc: row.amt}); }
  opt.pm.edit = null; save(); render();
};
ACTIONS.discAdd = (d)=>{
  const pid = d.pid;
  const f = document.getElementById('bcFrom'), t = document.getElementById('bcTo');
  const kind = document.getElementById('bcKind'), amt = document.getElementById('bcAmt');
  const scope = document.getElementById('bcScope');
  const v = Number(amt && amt.value);
  if(!v || v<=0){ alert('할인 금액(율)을 입력하세요.'); return; }
  const typeName = {promo:'프로모션', instant:'즉시할인', coupon:'다운로드쿠폰'}[opt.pm.tab||'promo'];
  const p = BC7.rfm.find(x=>x.pid===pid);
  const normals = bcOpt(pid).filter(o=>o.state==='일반상품');
  const targets = scope && scope.value!=='all' ? normals.filter(o=>o.optId===scope.value) : normals;
  const list = bcHist(pid).slice();
  targets.forEach(o=>{
    const price = bcNum(o.price)||0;
    const amount = (kind && kind.value==='pct') ? Math.round(price*v/100) : Math.round(v);
    const from = (f&&f.value ? f.value.replace(/-/g,'/') : '2026/11/20');
    const to = (t&&t.value ? t.value.replace(/-/g,'/') : '');
    const dup = list.findIndex(r=>r.optId===o.optId && r.from===from && r.to===to);
    const row = {optId:o.optId, from, to, type:typeName, price, amt:amount, sale:price-amount};
    if(dup>=0) list[dup] = row; else list.unshift(row);
    S.pm.ov[o.optId] = Object.assign({}, S.pm.ov[o.optId], {disc: amount});
  });
  S.pm.dh[pid] = list; save(); render();
};
ACTIONS.chEdit = d=>{ opt.pm.edit = {i:+d.i}; render(); };
ACTIONS.chCancel = ()=>{ opt.pm.edit = null; render(); };
ACTIONS.chDel = d=>{
  const list = bcCostHist(d.pid).slice(); const row = list[+d.i]; if(!row) return;
  if(!confirm(`원가 이력을 삭제할까요?\n${row.date} ${row.optId}`)) return;
  list.splice(+d.i,1); S.pm.ch[d.pid] = list; save(); render();
};
ACTIONS.chSave = (d, el)=>{
  const pid = d.pid, i = +d.i; const list = bcCostHist(pid).slice(); const row = list[i]; if(!row) return;
  const tr = el.closest('tr');
  const g = k => { const n = tr.querySelector(`[data-h="${k}"]`); return n ? n.value : ''; };
  row.date = g('date') || row.date; row.cost = Number(g('cost')) || 0;
  list[i] = row; S.pm.ch[pid] = list;
  S.pm.ov[row.optId] = Object.assign({}, S.pm.ov[row.optId], {cost: row.cost});
  opt.pm.edit = null; save(); render();
};
ACTIONS.chAdd = d=>{
  const pid = d.pid; const list = bcCostHist(pid).slice();
  const p = BC7.rfm.find(x=>x.pid===pid);
  const o = (bcOpt(pid).find(x=>x.state==='일반상품') || {}).optId;
  list.unshift({date:'2026-11-20', optId:o||'', name:p.name, state:'일반상품', cost:0});
  S.pm.ch[pid] = list; opt.pm.edit = {i:0}; save(); render();
};
ACTIONS.costApply = d=>{
  const pid = d.pid;
  const dt = document.getElementById('bcCostDate'), cv = document.getElementById('bcCostVal');
  const v = Number(cv && cv.value);
  if(!v){ alert('원가를 입력하세요.'); return; }
  const date = (dt && dt.value) || '2026-11-20';
  const list = bcCostHist(pid).slice();
  bcOpt(pid).forEach(o=>{
    S.pm.ov[o.optId] = Object.assign({}, S.pm.ov[o.optId], {cost: v});
    const dup = list.findIndex(r=>r.optId===o.optId && r.date===date);
    const row = {date, optId:o.optId, name:o.name, state:o.state, cost:v};
    if(dup>=0) list[dup] = row; else list.unshift(row);
  });
  S.pm.ch[pid] = list; save(); render();
};
ACTIONS.costClear = d=>{
  const pid = d.pid;
  if(!confirm('이 상품 옵션의 원가 입력을 지울까요? (상품관리 표에서 원가가 빈칸이 됩니다)')) return;
  bcOpt(pid).forEach(o=>{ S.pm.ov[o.optId] = Object.assign({}, S.pm.ov[o.optId], {cost: null}); });
  S.pm.ch[pid] = []; save(); render();
};

/* ==================== 3. 판매자배송 상품관리 ==================== */
VIEWS.pm3p = function(){
  const rows = BC7.p3p.map(p=>{
    const base = p.price - p.disc;
    const profit = Math.round(base - base*p.fee/100 - p.cost);
    const pct = p.price ? profit/p.price*100 : 0;
    const optRows = (p.options||[]).map(o=>`<tr class="sub"><td class="l mono">${bcEsc(o.optId)}</td><td class="l">${bcEsc(o.name)}</td><td class="r num">${bcMoney(p.price)}</td><td class="r num">${bcMoney(p.disc)}</td><td class="r num">${bcMoney(profit)}<span class="pct">(${pct.toFixed(2)}%)</span></td><td class="r num">${p.fee}%</td><td class="r num">${bcMoney(p.cost)}</td></tr>`).join('');
    const open = !!S.pm.open['3p'+p.pid];
    return `<tr class="pmprod">
      <td>${p.options&&p.options.length?`<button class="exp" data-act="pmToggle" data-id="3p${p.pid}">${open?'▾':'▸'}</button>`:''}</td>
      <td class="l mono">${bcEsc(p.pid)}</td><td><span class="thumb">${p.icon}</span></td>
      <td class="l">${bcEsc(p.name)}</td><td><span class="tag gray">판매자배송</span></td>
      <td class="r num">${bcMoney(p.price)}</td><td class="r num">${bcMoney(p.disc)}</td>
      <td class="r num">${bcMoney(profit)}<span class="pct">(${pct.toFixed(2)}%)</span></td>
      <td class="r num">${p.fee}%</td><td class="r num">${bcMoney(p.cost)}</td></tr>`
      + (open&&optRows?`<tr class="subwrap"><td colspan="10" class="flush"><table class="tbl sub"><thead><tr><th class="l">옵션ID</th><th class="l">옵션명</th><th class="r">옵션가</th><th class="r">할인금액</th><th class="r">이익금(%)</th><th class="r">마켓수수료</th><th class="r">원가</th></tr></thead><tbody>${optRows}</tbody></table></td></tr>`:'');
  }).join('');
  return topbar('판매자배송 상품관리', '리스페토 · 판매자배송(3P) 4개 상품 · 빅셀 수집 2026-11-20',
      `<span class="chip">원가 미입력 <b>0</b></span>`)
  + `<div class="alert info" style="margin-bottom:12px">* 현재 운영하지 않는 상품은 상품관리에서 숨김처리를 권장합니다. 판매자배송에는 입출고요금·배송비 항목이 없습니다(로켓그로스만 별도).</div>
  <div class="card"><div class="filterbar">
    <button class="btn">전체선택</button>
    <select class="inp sm"><option>스토어: 리스</option></select>
    <select class="inp sm"><option>판매자배송</option></select>
    <input class="inp sm grow" placeholder="노출상품·옵션·SKU ID, 상품명, 옵션명">
    <button class="btn dark">검색</button><span class="spacer"></span>
    <button class="btn" data-act="pmExport3p">📊 엑셀 다운로드</button>
  </div>
  <div class="tbl-wrap"><table class="tbl pm"><thead><tr>
    <th style="width:34px"></th><th class="l">노출상품ID</th><th>이미지</th><th class="l">상품명</th><th>구분</th>
    <th class="r">판매가</th><th class="r">할인금액</th><th class="r">이익금(%)</th><th class="r">마켓수수료</th><th class="r">원가</th>
  </tr></thead><tbody>${rows}</tbody></table></div></div>`;
};
ACTIONS.pmExport3p = ()=>{
  const rows = [['노출상품ID','상품명','구분','판매가','할인금액','마켓수수료%','원가','이익금','이익금%']];
  BC7.p3p.forEach(p=>{ const base=p.price-p.disc; const pr=Math.round(base-base*p.fee/100-p.cost);
    rows.push([p.pid,p.name,'판매자배송',p.price,p.disc,p.fee,p.cost,pr,(p.price?pr/p.price*100:0).toFixed(2)]); });
  const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='판매자배송-상품관리-2026-11-20.csv'; a.click();
};

/* ==================== 4. 네이버 메뉴(멤버십 전용) ==================== */
function bcMembership(kind){
  return topbar(`${kind} ${kind==='상품'?'관리':'분석'}`, '네이버 채널 · 리스페토',
      `<span class="chip">데이터 <b>0건</b></span>`)
  + `<div class="card"><div class="card-b" style="padding:26px; text-align:center">
      <div style="font-size:34px">🟢</div>
      <h2 style="margin:8px 0 4px; font-size:17px">네이버 ${kind}은 빅셀 멤버십 전용 메뉴입니다</h2>
      <p style="color:var(--muted); font-size:13px; max-width:560px; margin:0 auto 14px">
        빅셀에서 <b>네이버 ${kind==='상품'?'상품 관리':'매출 분석'}</b>을 열면 멤버십 인증 경로
        (<code>/v2/membership/validate/naver/...</code>)로 이동하며, 현재 계정(thfwysla)에서는
        ${kind} 데이터가 표시되지 않습니다(0건). 네이버 판매를 시작하고 멤버십을 연결하면 같은 화면에 데이터가 채워집니다.
      </p>
      <div class="alert info" style="display:inline-block; text-align:left">
        ${kind==='상품'
          ? '표 구조(멤버십 연결 시): 스토어 | 담당자 | 노출상품ID | 이미지 | 상품명 | 구분 | 판매가 | 할인금액 | 이익금(%) | 마켓수수료 | 원가'
          : '표 구조(멤버십 연결 시): 날짜 | 주문수 | 판매수량 | 매출 | 취소·반품 | 정산예정금 | 이익금'}
      </div>
    </div></div>`;
}
VIEWS.pmnaver = ()=> bcMembership('상품');
VIEWS.sanaver = ()=> bcMembership('매출');

/* ==================== 5. 판매자배송 매출분석 ==================== */

      <div class="kpi"><div class="lab">판매수량</div><div class="val num">0개</div><div class="delta flat">3P 채널</div></div>
      <div class="kpi"><div class="lab">이익금</div><div class="val num">0원</div><div class="delta flat">원가·수수료 반영</div></div>

      <tr class="total"><td class="l"><b>합계</b></td><td></td><td class="r num"><b>0</b></td><td class="r num"><b>0</b></td><td class="r num"><b>0</b></td><td class="r num"><b>0</b></td><td></td><td></td></tr>
    </tbody></table></div>

};
