<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile frame preview</title>
<style>
  html,body{margin:0;padding:0;background:#1f1f1f}
  #frame{display:block;border:0;background:#fff;width:390px;height:9000px;margin:0}
</style>
</head>
<body>
<iframe id="frame" src="about:blank" title="mobile 390 preview"></iframe>
<script>
(async function(){
  var RAW = 'https://raw.githubusercontent.com/jooyong00700-art/jy/main/wing-modoo.html';
  try {
    var res = await fetch(RAW, {cache: 'no-store'});
    var html = await res.text();
    var f = document.getElementById('frame');
    var d = f.contentDocument;
    d.open(); d.write(html); d.close();
    window.__frameReady = true;
  } catch (e) {
    document.title = 'frame error: ' + e.message;
  }
})();
</script>
</body>
</html>
